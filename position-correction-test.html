
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>光行差補正比較テスト</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 16px;
      color: #333;
    }

    h1 {
      font-size: 24px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin: 20px 0;
    }

    input, button {
      padding: 9px;
      font-size: 14px;
    }

    button {
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }

    th {
      background: #f3f3f3;
    }

    #status {
      padding: 12px;
      background: #f5f5f5;
      margin-top: 16px;
      white-space: pre-wrap;
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #c62828;
    }

    .note {
      background: #f5f5f5;
      padding: 12px;
      margin-top: 16px;
      line-height: 1.7;
    }

    .table-wrap {
      overflow-x: auto;
    }
  </style>
</head>

<body>

  <h1>光行差補正比較テスト</h1>

  <p>
    Astronomy Engineを使用して、土星と海王星の
    光行差補正あり・なしの黄経を比較します。
  </p>

  <div class="controls">
    <label>
      計算日時：
      <input type="datetime-local" id="datetime">
    </label>

    <button id="calculate">比較計算する</button>
  </div>

  <div id="status">計算待機中です。</div>

  <h2>比較結果</h2>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>天体</th>
          <th>補正あり</th>
          <th>補正なし</th>
          <th>補正による変化</th>
          <th>JPLとの差（補正あり）</th>
          <th>JPLとの差（補正なし）</th>
        </tr>
      </thead>

      <tbody id="results">
        <tr>
          <td colspan="6">まだ計算されていません。</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="note">
    <strong>計算条件</strong><br>
    ・地心位置<br>
    ・黄道座標への変換はAstronomy.Ecliptic()を使用<br>
    ・光行時間補正は両方とも有効<br>
    ・光行差補正のみtrue / falseで切り替え<br>
    ・JPLとの比較は2026年12月14日03:00 UTCのみ
  </div>

  <h2>JSON出力</h2>
  <pre id="raw">未実行</pre>

  <script src="./astronomy/astronomy.browser.min.js"></script>

  <script>
    const $ = (id) => document.getElementById(id);

    // JPL Horizonsの基準値
    // 2026年12月14日 03:00 UTC
    const JPL_REFERENCE = {
      saturn: 7.9400792,
      neptune: 1.6133162
    };

    // 比較対象
    const TARGETS = [
      {
        id: "saturn",
        name: "土星",
        bodyName: "Saturn"
      },
      {
        id: "neptune",
        name: "海王星",
        bodyName: "Neptune"
      }
    ];

    // 黄経を0〜360度に正規化
    function normalizeLongitude(degrees) {
      return ((degrees % 360) + 360) % 360;
    }

    // 角度差を-180〜180度に収める
    function angleDifference(a, b) {
      return ((a - b + 540) % 360) - 180;
    }

    // 天体の黄経を取得
    function getLongitude(body, time, aberration) {
      const vector = Astronomy.GeoVector(
        body,
        time,
        aberration
      );

      const ecliptic = Astronomy.Ecliptic(vector);

      return normalizeLongitude(ecliptic.elon);
    }

    function calculate() {
      $("status").textContent = "計算中...";
      $("status").className = "";
      $("results").innerHTML = "";
      $("raw").textContent = "";

      try {
        if (!window.Astronomy) {
          throw new Error(
            "Astronomy Engineが読み込まれていません。"
          );
        }

        const value = $("datetime").value;

        if (!value) {
          throw new Error("計算日時を指定してください。");
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
          throw new Error("日時が正しくありません。");
        }

        const time = Astronomy.MakeTime(date);

        const isReferenceDate =
          date.toISOString() ===
          "2026-12-14T03:00:00.000Z";

        const output = {
          datetime: date.toISOString(),
          coordinate_system:
            "geocentric_true_ecliptic_of_date",
          zodiac: "tropical",
          comparison: "stellar_aberration_on_off",
          light_time_correction: true,
          results: {}
        };

        for (const target of TARGETS) {
          const body = Astronomy.Body[target.bodyName];

          if (!body) {
            throw new Error(
              target.name + "の天体情報を取得できません。"
            );
          }

          // 光行差補正あり
          const withAberration =
            getLongitude(body, time, true);

          // 光行差補正なし
          const withoutAberration =
            getLongitude(body, time, false);

          // 補正による経度変化（秒角）
          const correctionDifference =
            angleDifference(
              withAberration,
              withoutAberration
            ) * 3600;

          let jplWith = null;
          let jplWithout = null;

          if (isReferenceDate) {
            jplWith =
              angleDifference(
                withAberration,
                JPL_REFERENCE[target.id]
              ) * 3600;

            jplWithout =
              angleDifference(
                withoutAberration,
                JPL_REFERENCE[target.id]
              ) * 3600;
          }

          output.results[target.id] = {
            name: target.name,
            longitude_with_aberration:
              withAberration,
            longitude_without_aberration:
              withoutAberration,
            correction_difference_arcsec:
              correctionDifference,
            jpl_difference_with_arcsec:
              jplWith,
            jpl_difference_without_arcsec:
              jplWithout
          };

          const row = document.createElement("tr");

          const values = [
            target.name,
            withAberration.toFixed(9) + "°",
            withoutAberration.toFixed(9) + "°",
            correctionDifference.toFixed(4) + "″",
            jplWith === null
              ? "比較対象外"
              : jplWith.toFixed(4) + "″",
            jplWithout === null
              ? "比較対象外"
              : jplWithout.toFixed(4) + "″"
          ];

          values.forEach(value => {
            const cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);
          });

          $("results").appendChild(row);
        }

        $("status").textContent =
          "比較計算が完了しました。";

        $("status").className = "success";

        $("raw").textContent =
          JSON.stringify(output, null, 2);

      } catch (error) {
        $("status").textContent =
          "エラー：" + error.message;

        $("status").className = "error";

        $("raw").textContent = error.stack || error.message;

        console.error(error);
      }
    }

    // 初期日時：2026年12月14日 12:00 JST
    $("datetime").value = "2026-12-14T12:00";

    $("calculate").addEventListener(
      "click",
      calculate
    );

  </script>

</body>
</html>
