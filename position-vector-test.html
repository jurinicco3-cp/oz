
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neptune JPL Vector Comparison</title>
</head>
<body>
  <h1>Neptune JPL Vector Comparison</h1>
  <pre id="output">計算中...</pre>

  <script src="./astronomy/astronomy.browser.min.js"></script>
  <script>
    console.log("Astronomy Engine:", window.Astronomy);
    console.log(
      "MakeTime:",
      typeof window.Astronomy?.MakeTime
    );
  </script>
  <script>
    const Astronomy = window.Astronomy;

    // JPL Horizons GEOMETRIC / ICRF / AU-D
    const testCases = [
      {
        name: "2026-11-14",
        utcStart: "2026-11-14T02:58:50.8166Z",
        jpl: [
          {
            x: 29.21204567131619,
            y: 0.9704283284204748,
            z: -0.3625580818067131
          },
          {
            x: 29.21205507508567,
            y: 0.9704235523297892,
            z: -0.3625601978747961
          }
        ]
      },
      {
        name: "2026-12-14",
        utcStart: "2026-12-14T02:58:50.8166Z",
        jpl: [
          {
            x: 29.68265615139564,
            y: 0.8732901572584891,
            z: -0.4066400304434343
          },
          {
            x: 29.68266803659555,
            y: 0.8732906514471209,
            z: -0.4066398615137103
          }
        ]
      }
    ];

    function subtractVectors(a, b) {
      return {
        x: a.x - b.x,
        y: a.y - b.y,
        z: a.z - b.z
      };
    }

    function dot(a, b) {
      return a.x * b.x + a.y * b.y + a.z * b.z;
    }

    function magnitude(v) {
      return Math.sqrt(dot(v, v));
    }

    function compareVectors(jpl, ae) {
      const delta = {
        x: ae.x - jpl.x,
        y: ae.y - jpl.y,
        z: ae.z - jpl.z
      };

      const cosAngle = Math.max(
        -1,
        Math.min(
          1,
          dot(jpl, ae) / (magnitude(jpl) * magnitude(ae))
        )
      );

      const angleArcsec =
        Math.acos(cosAngle) * 180 / Math.PI * 3600;

      return {
        delta_x_au: delta.x,
        delta_y_au: delta.y,
        delta_z_au: delta.z,
        direction_difference_arcsec: angleArcsec,
        distance_difference_au:
          magnitude(ae) - magnitude(jpl),
        vector_difference_au: magnitude(delta)
      };
    }

    function calculateAE(date) {
      const time = Astronomy.MakeTime(date);

      const neptune = Astronomy.HelioVector(
        Astronomy.Body.Neptune,
        time
      );

      const earth = Astronomy.HelioVector(
        Astronomy.Body.Earth,
        time
      );

      return subtractVectors(neptune, earth);
    }

    function runTest() {
      const results = [];

      for (const test of testCases) {
        const start = new Date(test.utcStart);

        for (let i = 0; i < 2; i++) {
          const date = new Date(start.getTime() + i * 60000);

          const aeVector = calculateAE(date);
          const jplVector = test.jpl[i];

          results.push({
            epoch: test.name,
            minute: i,
            utc: date.toISOString(),
            jpl_vector_au: jplVector,
            astronomy_engine_geometric_vector_au: aeVector,
            comparison: compareVectors(jplVector, aeVector)
          });
        }
      }

      const directionDifferences = results.map(
        r => r.comparison.direction_difference_arcsec
      );

      const output = {
        test_name: "Neptune JPL geometric vector comparison",
        jpl_reference_frame: "ICRF",
        astronomy_engine_frame: "EQJ",
        jpl_correction: "GEOMETRIC",
        astronomy_engine_calculation:
          "HelioVector(Neptune) - HelioVector(Earth)",
        astronomy_engine_correction:
          "geometric_no_light_time_no_aberration",
        note:
          "ICRF and EQJ frame difference is not corrected. " +
          "UTC conversion uses an approximate TDB-UTC offset.",
        results,
        summary: {
          mean_direction_difference_arcsec:
            directionDifferences.reduce((a, b) => a + b, 0) /
            directionDifferences.length,
          minimum_direction_difference_arcsec:
            Math.min(...directionDifferences),
          maximum_direction_difference_arcsec:
            Math.max(...directionDifferences)
        }
      };

      document.getElementById("output").textContent =
        JSON.stringify(output, null, 2);

      console.log(output);
    }

    try {
      runTest();
    } catch (error) {
      document.getElementById("output").textContent =
        "エラー: " + error.message;
      console.error(error);
    }
  </script>
</body>
</html>
