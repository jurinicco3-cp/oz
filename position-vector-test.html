
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neptune JPL Vector Comparison</title>

  <script src="astronomy/astronomy.browser.min.js"></script>

  <style>
    body {
      font-family: sans-serif;
      margin: 24px;
      line-height: 1.6;
      background: #f7f7f7;
      color: #222;
    }

    h1 {
      font-size: 21px;
    }

    button {
      padding: 10px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    pre {
      background: #fff;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 6px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .note {
      color: #555;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <h1>Neptune JPL Vector Comparison</h1>

  <p>
    JPL HorizonsのTDB時刻と、Astronomy EngineのTT時刻を使って
    海王星の位置ベクトルを比較するテストです。
  </p>

  <p class="note">
    今回はTDBとTTの差をいったん無視し、
    JPLのTDB数値をTTとして直接指定します。
  </p>

  <button onclick="runTest()">比較テストを実行</button>

  <h2>実行結果</h2>
  <pre id="output">ボタンを押すと結果が表示されます。</pre>

<script>
"use strict";

// ========================================
// 1. JPL Horizonsの基準データ
// ========================================

const test = {
  date: "2026-12-14",

  // JPL Horizons:
  // 2026-12-14 03:00:00 TDB
  // J2000.0からの経過日数
  tdb_days_since_j2000: 9843.625,

  jpl: {
    frame: "Ecliptic of J2000.0",
    correction: "GEOMETRIC",

    neptune: {
      x: 29.82397936270362,
      y: 1.613720016140708,
      z: -0.7205212703196399
    }
  }
};


// ========================================
// 2. ベクトル計算
// ========================================

function subtractVectors(a, b) {
  return {
    x: a.x - b.x,
    y: a.y - b.y,
    z: a.z - b.z
  };
}

function vectorLength(v) {
  return Math.sqrt(
    v.x * v.x +
    v.y * v.y +
    v.z * v.z
  );
}

function dotProduct(a, b) {
  return (
    a.x * b.x +
    a.y * b.y +
    a.z * b.z
  );
}

function directionDifferenceArcsec(a, b) {
  const dot = dotProduct(a, b);
  const lenA = vectorLength(a);
  const lenB = vectorLength(b);

  let cosAngle = dot / (lenA * lenB);

  // 浮動小数点誤差対策
  cosAngle = Math.max(-1, Math.min(1, cosAngle));

  const radians = Math.acos(cosAngle);

  return radians * (180 / Math.PI) * 3600;
}


// ========================================
// 3. Astronomy Engineによる計算
// ========================================

function calculate() {

  if (typeof Astronomy === "undefined") {
    throw new Error(
      "Astronomy Engineが読み込まれていません。"
    );
  }

  if (
    typeof Astronomy.AstroTime?.FromTerrestrialTime
    !== "function"
  ) {
    throw new Error(
      "AstroTime.FromTerrestrialTime が見つかりません。"
      + "ライブラリのバージョンを確認してください。"
    );
  }

  // --------------------------------------
  // TDB時刻をTTとして直接指定
  // --------------------------------------

  const time =
    Astronomy.AstroTime.FromTerrestrialTime(
      test.tdb_days_since_j2000
    );

  // --------------------------------------
  // 時刻情報
  // --------------------------------------

  const timeCheck = {
    requested_tdb_days: test.tdb_days_since_j2000,

    tt_days: time.tt,

    ut_days: time.ut,

    delta_t_seconds:
      (time.tt - time.ut) * 86400,

    approximate_utc_from_engine:
      time.date.toISOString()
  };

  // --------------------------------------
  // 海王星の太陽中心ベクトル
  // EQJ座標
  // --------------------------------------

  const neptuneEqj = Astronomy.HelioVector(
    Astronomy.Body.Neptune,
    time
  );

  // --------------------------------------
  // EQJからJ2000黄道座標ECLへ変換
  // --------------------------------------

  const rotation = Astronomy.Rotation_EQJ_ECL();

  const neptuneEcl = Astronomy.RotateVector(
    rotation,
    neptuneEqj
  );

  // --------------------------------------
  // JPLとの比較
  // --------------------------------------

  const jplVector = test.jpl.neptune;

  const delta = subtractVectors(
    neptuneEcl,
    jplVector
  );

  const directionDifference =
    directionDifferenceArcsec(
      neptuneEcl,
      jplVector
    );

  const distanceDifference =
    vectorLength(neptuneEcl) -
    vectorLength(jplVector);

  const vectorDifference =
    vectorLength(delta);

  return {

    date: test.date,

    epoch_tdb: "2026-12-14 03:00:00",

    jpl_frame: test.jpl.frame,

    astronomy_engine_original_frame: "EQJ",

    astronomy_engine_converted_frame: "ECL",

    jpl_correction: test.jpl.correction,

    astronomy_engine_calculation:
      "HelioVector(Neptune) -> Rotation_EQJ_ECL -> RotateVector",

    astronomy_engine_time_method:
      "AstroTime.FromTerrestrialTime",

    time_check: timeCheck,

    astronomy_engine_raw_eqj: {
      x: neptuneEqj.x,
      y: neptuneEqj.y,
      z: neptuneEqj.z
    },

    astronomy_engine_converted_ecl: {
      x: neptuneEcl.x,
      y: neptuneEcl.y,
      z: neptuneEcl.z
    },

    comparison: {

      jpl_vector_au: jplVector,

      astronomy_engine_vector_au: {
        x: neptuneEcl.x,
        y: neptuneEcl.y,
        z: neptuneEcl.z
      },

      delta_ae_minus_jpl_au: delta,

      direction_difference_arcsec:
        directionDifference,

      distance_difference_au:
        distanceDifference,

      vector_difference_au:
        vectorDifference
    },

    note:
      "JPL TDB is temporarily treated as TT. " +
      "TDB-TT periodic difference is not corrected. " +
      "The UTC value shown is an approximate value " +
      "derived by Astronomy Engine."
  };
}


// ========================================
// 4. テスト実行
// ========================================

function runTest() {

  const output = document.getElementById("output");

  try {

    const result = calculate();

    output.textContent = JSON.stringify(
      result,
      null,
      2
    );

    console.log(result);

  } catch (error) {

    output.textContent =
      "エラーが発生しました。\n\n" +
      error.message;

    console.error(error);
  }
}

</script>

</body>
</html>
