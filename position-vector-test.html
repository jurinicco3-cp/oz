
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JPL Multi Planet Vector Comparison</title>

  <script src="astronomy/astronomy.browser.min.js"></script>

  <style>
    body {
      font-family: sans-serif;
      margin: 24px;
      line-height: 1.6;
      background: #f7f7f7;
      color: #222;
    }

    h1 { font-size: 21px; }

    button {
      padding: 11px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    pre {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 16px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 13px;
    }

    .note {
      color: #555;
      font-size: 14px;
    }
  </style>
</head>

<body>

<h1>JPL Multi Planet Vector Comparison</h1>

<p>
  JPL HorizonsとAstronomy Engineの太陽中心ベクトルを
  同じ条件で比較します。
</p>

<p class="note">
  日時：2026-11-14 03:00:00 TDB<br>
  座標系：Ecliptic of J2000.0<br>
  補正：GEOMETRIC
</p>

<button onclick="runTest()">一括比較を実行</button>

<h2>比較結果</h2>
<pre id="output">実行ボタンを押してください。</pre>

<script>
"use strict";

// ========================================
// 1. 共通テスト条件
// ========================================

const TEST = {
  date: "2026-03-14",
  epochTDB: "2026-03-14 03:00:00",
  tdbDays: 9668.625
};


// ========================================
// 2. JPL Horizonsデータ
//
// 単位：AU
// Center：Sun (10)
// Correction：GEOMETRIC
// Reference plane：Ecliptic of J2000.0
// ========================================


const JPL_DATA = {

  Mercury: {
    x: -0.3950133444001970,
    y: -0.09228972541276226,
    z: 0.02868753142356740
  },

  Venus: {
    x: 0.6172401353247079,
    y: 0.3774891637964044,
    z: -0.03042828485591247
  },

  Earth: {
    x: -0.9870763239814204,
    y: 0.1181506393281066,
    z: 0.0000004984338541689782
  },

  Mars: {
    x: 1.176545371654912,
    y: -0.7243192047055687,
    z: -0.04402889377437111
  },

  Jupiter: {
    x: -2.205410995290460,
    y: 4.750918464683677,
    z: 0.02960748043043223
  },

  Saturn: {
    x: 9.465453020272360,
    y: 0.6587168663583428,
    z: -0.3882519746391841
  },

  Uranus: {
    x: 9.632166685971749,
    y: 16.92880597315090,
    z: -0.06202292519150454
  },

  Neptune: {
    x: 29.86536533526377,
    y: 0.7466025389237427,
    z: -0.7036026325338852
  },

  Pluto: {
    x: 19.42336263998560,
    y: -29.57911304065149,
    z: -2.452035880489071
  }

};

// ========================================
// 3. Astronomy Engineの天体対応表
// ========================================

const BODIES = [
  { name: "Mercury", body: "Mercury" },
  { name: "Venus", body: "Venus" },
  { name: "Earth", body: "Earth" },
  { name: "Mars", body: "Mars" },
  { name: "Jupiter", body: "Jupiter" },
  { name: "Saturn", body: "Saturn" },
  { name: "Uranus", body: "Uranus" },
  { name: "Neptune", body: "Neptune" },
  { name: "Pluto", body: "Pluto" }
];


// ========================================
// 4. ベクトル計算
// ========================================

function vectorLength(v) {
  return Math.sqrt(
    v.x * v.x +
    v.y * v.y +
    v.z * v.z
  );
}

function subtractVectors(a, b) {
  return {
    x: a.x - b.x,
    y: a.y - b.y,
    z: a.z - b.z
  };
}

function dotProduct(a, b) {
  return (
    a.x * b.x +
    a.y * b.y +
    a.z * b.z
  );
}

function directionDifferenceArcsec(a, b) {

  const dot = dotProduct(a, b);
  const lenA = vectorLength(a);
  const lenB = vectorLength(b);

  let cosAngle = dot / (lenA * lenB);

  cosAngle = Math.max(
    -1,
    Math.min(1, cosAngle)
  );

  const angle = Math.acos(cosAngle);

  return angle * 180 / Math.PI * 3600;
}


// ========================================
// 5. JPLデータの入力チェック
// ========================================

function hasJplVector(v) {

  return (
    v &&
    Number.isFinite(v.x) &&
    Number.isFinite(v.y) &&
    Number.isFinite(v.z)
  );
}


// ========================================
// 6. メイン計算
// ========================================

function calculate() {

  if (typeof Astronomy === "undefined") {
    throw new Error(
      "Astronomy Engineが読み込まれていません。"
    );
  }

  if (
    typeof Astronomy.AstroTime?.FromTerrestrialTime
    !== "function"
  ) {
    throw new Error(
      "AstroTime.FromTerrestrialTimeが見つかりません。"
    );
  }

  // JPLのTDBをTTとして直接指定
  const time =
    Astronomy.AstroTime.FromTerrestrialTime(
      TEST.tdbDays
    );

  // EQJ → ECL
  const rotation =
    Astronomy.Rotation_EQJ_ECL();

  const results = [];

  for (const item of BODIES) {

    const body = Astronomy.Body[item.body];

    if (body === undefined) {
      throw new Error(
        "天体が見つかりません: " + item.body
      );
    }

    // Astronomy Engineの太陽中心ベクトル
    const raw = Astronomy.HelioVector(
      body,
      time
    );

    // ECL座標に変換
    const ecl = Astronomy.RotateVector(
      rotation,
      raw
    );

    const jpl = JPL_DATA[item.name];

    const result = {
      body: item.name,

      astronomy_engine_eqj: {
        x: raw.x,
        y: raw.y,
        z: raw.z
      },

      astronomy_engine_ecl: {
        x: ecl.x,
        y: ecl.y,
        z: ecl.z
      },

      jpl_vector_available: hasJplVector(jpl)
    };

    if (hasJplVector(jpl)) {

      const delta = subtractVectors(ecl, jpl);

      result.jpl_vector_ecl = jpl;

      result.comparison = {
  delta_x_au: delta.x,
  delta_y_au: delta.y,
  delta_z_au: delta.z,

  delta_ae_minus_jpl_au: delta,

  direction_difference_arcsec:
    directionDifferenceArcsec(ecl, jpl),

  distance_difference_au:
    vectorLength(ecl) - vectorLength(jpl),

  vector_difference_au:
    vectorLength(delta)
};

    } else {

      result.message =
        "JPLベクトル未入力。データ取得後に比較可能。";
    }

    results.push(result);
  }

  const compared = results.filter(
    r => r.comparison
  );

  const errors = compared.map(
    r => r.comparison.direction_difference_arcsec
  );

  const mean = errors.length
    ? errors.reduce((a, b) => a + b, 0) / errors.length
    : null;

  const max = errors.length
    ? Math.max(...errors)
    : null;

  const summary = {
    total_bodies: results.length,
    compared_bodies: compared.length,
    waiting_for_jpl_data:
      results.length - compared.length,

    mean_direction_difference_arcsec: mean,
    max_direction_difference_arcsec: max
  };

  return {
    test_name:
      "JPL and Astronomy Engine multi-body vector comparison",

    epoch_tdb: TEST.epochTDB,

    jpl_center: "Sun (10)",

    jpl_correction: "GEOMETRIC",

    jpl_reference_plane:
      "Ecliptic of J2000.0",

    astronomy_engine_original_frame: "EQJ",

    astronomy_engine_converted_frame: "ECL",

    astronomy_engine_calculation:
      "HelioVector(body) -> Rotation_EQJ_ECL -> RotateVector",

    astronomy_engine_time_method:
      "AstroTime.FromTerrestrialTime",

    time_check: {
      requested_tdb_days: TEST.tdbDays,
      tt_days: time.tt,
      ut_days: time.ut,
      delta_t_seconds:
        (time.tt - time.ut) * 86400
    },

    summary: summary,

    results: results,

    note:
      "JPL TDB is temporarily treated as TT. " +
      "Only bodies with entered JPL vectors are compared. " +
      "ICRF and EQJ alignment is not explicitly corrected."
  };
}


// ========================================
// 7. 実行
// ========================================

function runTest() {

  const output =
    document.getElementById("output");

  try {

    const result = calculate();

    output.textContent = JSON.stringify(
      result,
      null,
      2
    );

    console.log(result);

  } catch (error) {

    output.textContent =
      "エラーが発生しました。\n\n" +
      error.message;

    console.error(error);
  }
}

</script>

</body>
</html>
