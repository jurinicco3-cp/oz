
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earth JPL Vector Comparison</title>
  <script src="astronomy/astronomy.browser.min.js"></script>

  <style>
    body {
      font-family: sans-serif;
      margin: 24px;
      line-height: 1.6;
      background: #f7f7f7;
      color: #222;
    }

    h1 { font-size: 21px; }

    button {
      padding: 10px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    pre {
      background: white;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 6px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

<h1>Earth JPL Vector Comparison</h1>

<p>
  2026-12-14 03:00:00 TDBにおける地球の太陽中心ベクトルを比較します。
</p>

<button onclick="runTest()">比較テストを実行</button>

<h2>実行結果</h2>
<pre id="output">ボタンを押してください。</pre>

<script>
"use strict";

// ========================================
// 1. JPL Horizonsの基準データ
// ========================================

const test = {
  date: "2026-12-14",
  tdb_days_since_j2000: 9843.625,

  jpl: {
    target: "Earth (399)",
    center: "Sun (10)",
    frame: "ICRF",
    correction: "GEOMETRIC",

    earth: {
      x: 0.1413232111907993,
      y: 0.893875912451149,
      z: 0.3874756481013887
    }
  }
};


// ========================================
// 2. ベクトル計算
// ========================================

function subtractVectors(a, b) {
  return {
    x: a.x - b.x,
    y: a.y - b.y,
    z: a.z - b.z
  };
}

function vectorLength(v) {
  return Math.sqrt(
    v.x * v.x +
    v.y * v.y +
    v.z * v.z
  );
}

function dotProduct(a, b) {
  return (
    a.x * b.x +
    a.y * b.y +
    a.z * b.z
  );
}

function directionDifferenceArcsec(a, b) {
  const dot = dotProduct(a, b);
  const lenA = vectorLength(a);
  const lenB = vectorLength(b);

  let cosAngle = dot / (lenA * lenB);
  cosAngle = Math.max(-1, Math.min(1, cosAngle));

  const radians = Math.acos(cosAngle);

  return radians * 180 / Math.PI * 3600;
}


// ========================================
// 3. Astronomy Engineによる計算
// ========================================

function calculate() {

  if (typeof Astronomy === "undefined") {
    throw new Error("Astronomy Engineが読み込まれていません。");
  }

  if (
    typeof Astronomy.AstroTime?.FromTerrestrialTime
    !== "function"
  ) {
    throw new Error(
      "AstroTime.FromTerrestrialTime が見つかりません。"
    );
  }

  // JPLのTDB日数をTTとして直接指定
  const time = Astronomy.AstroTime.FromTerrestrialTime(
    test.tdb_days_since_j2000
  );

  // 時刻情報
  const timeCheck = {
    requested_tdb_days: test.tdb_days_since_j2000,
    tt_days: time.tt,
    ut_days: time.ut,
    delta_t_seconds: (time.tt - time.ut) * 86400,
    approximate_utc_from_engine: time.date.toISOString()
  };

  // 地球の太陽中心ベクトル
  // Astronomy EngineのHelioVectorはEQJ座標
  const earthEqj = Astronomy.HelioVector(
    Astronomy.Body.Earth,
    time
  );

  // JPLとの比較
  const jplVector = test.jpl.earth;

  const delta = subtractVectors(
    earthEqj,
    jplVector
  );

  const directionDifference =
    directionDifferenceArcsec(
      earthEqj,
      jplVector
    );

  const distanceDifference =
    vectorLength(earthEqj) -
    vectorLength(jplVector);

  const vectorDifference =
    vectorLength(delta);

  return {
    test_name: "Earth JPL heliocentric vector comparison",

    date: test.date,

    epoch_tdb: "2026-12-14 03:00:00",

    jpl_target: test.jpl.target,

    jpl_center: test.jpl.center,

    jpl_frame: test.jpl.frame,

    astronomy_engine_frame: "EQJ",

    jpl_correction: test.jpl.correction,

    astronomy_engine_calculation:
      "HelioVector(Earth)",

    astronomy_engine_time_method:
      "AstroTime.FromTerrestrialTime",

    time_check: timeCheck,

    jpl_vector_au: jplVector,

    astronomy_engine_vector_au: {
      x: earthEqj.x,
      y: earthEqj.y,
      z: earthEqj.z
    },

    comparison: {
      delta_ae_minus_jpl_au: delta,

      direction_difference_arcsec:
        directionDifference,

      distance_difference_au:
        distanceDifference,

      vector_difference_au:
        vectorDifference
    },

    note:
      "JPL uses ICRF and Astronomy Engine uses EQJ. " +
      "These frames are closely aligned but are not " +
      "assumed to be exactly identical. " +
      "JPL TDB is temporarily treated as TT."
  };
}


// ========================================
// 4. 実行
// ========================================

function runTest() {

  const output = document.getElementById("output");

  try {
    const result = calculate();

    output.textContent = JSON.stringify(
      result,
      null,
      2
    );

    console.log(result);

  } catch (error) {
    output.textContent =
      "エラーが発生しました。\n\n" + error.message;

    console.error(error);
  }
}

</script>

</body>
</html>
