
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JPL / Astronomy Engine ベクトル比較</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 16px;
      color: #222;
      line-height: 1.6;
    }
    h1 { font-size: 24px; }
    h2 { margin-top: 32px; font-size: 19px; }
    .note {
      background: #f3f5f7;
      padding: 12px 16px;
      border-radius: 8px;
      margin: 16px 0;
    }
    .status {
      padding: 12px;
      border-radius: 8px;
      background: #eaf6ed;
      margin: 16px 0;
    }
    .error { background: #fdecec; color: #9b2020; }
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 12px 0 24px;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 9px;
      text-align: right;
      overflow-wrap: anywhere;
    }
    th { background: #f3f5f7; }
    th:first-child, td:first-child { text-align: left; }
    pre {
      background: #f6f6f6;
      padding: 14px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 12px;
    }
    .metric {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 14px;
      margin: 8px 0;
    }
    .metric strong { font-size: 20px; }
    .small { color: #666; font-size: 13px; }
  </style>
</head>
<body>

<h1>JPL / Astronomy Engine ベクトル比較</h1>

<p>
  対象：2026年12月14日 03:00:00 TDB<br>
  比較：太陽中心の海王星・地球ベクトル、および地球中心の海王星ベクトル
</p>

<div id="status" class="status">計算中...</div>

<div class="note">
  <strong>注意：</strong>
  Astronomy EngineのHelioVectorはEQJ座標系、
  JPLの今回のデータはICRF座標系です。
  座標系の変換はまだ行っていないため、差には座標系の違いも含まれる可能性があります。
  また、TDBからUTCへの変換には近似値を使用しています。
</div>

<h2>1. 海王星の太陽中心ベクトル</h2>
<div id="neptune"></div>

<h2>2. 地球の太陽中心ベクトル</h2>
<div id="earth"></div>

<h2>3. 地球中心から見た海王星</h2>
<div id="geocentric"></div>

<h2>4. JSONデータ</h2>
<pre id="json"></pre>

<script src="astronomy/astronomy.browser.min.js"></script>
<script>
(function () {
  "use strict";

  const status = document.getElementById("status");

  // JPL Horizons：2026-12-14 03:00:00 TDB
  // 太陽中心・GEOMETRIC・ICRF・AU

  const jplNeptune = {
    x: 2.982397936270362E+01,
    y: 1.767166069707286E+00,
    z: -1.916438236671672E-02
  };

  const jplEarth = {
    x: 1.413232111907993E-01,
    y: 8.938759124511489E-01,
    z: 3.874756481013887E-01
  };

  // JPL Horizons：地球中心から見た海王星
  // GEOMETRIC・ICRF・AU
  const jplGeocentric = {
    x: 29.68265615139564,
    y: 0.8732901572584891,
    z: -0.4066400304434343
  };

  // 2026-12-14 03:00:00 TDB に対応するUTCの近似値
  const utcDate = new Date("2026-12-14T02:58:50.8166Z");

  function subtractVectors(a, b) {
    return {
      x: a.x - b.x,
      y: a.y - b.y,
      z: a.z - b.z
    };
  }

  function vectorLength(v) {
    return Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z);
  }

  function angularDifferenceArcsec(a, b) {
    const dot = a.x * b.x + a.y * b.y + a.z * b.z;
    const denominator = vectorLength(a) * vectorLength(b);

    let cosine = dot / denominator;
    cosine = Math.max(-1, Math.min(1, cosine));

    const radians = Math.acos(cosine);
    return radians * (180 / Math.PI) * 3600;
  }

  function compareVectors(jpl, ae) {
    const delta = subtractVectors(ae, jpl);

    return {
      jpl_vector_au: jpl,
      astronomy_engine_vector_au: ae,
      delta_ae_minus_jpl_au: delta,
      direction_difference_arcsec:
        angularDifferenceArcsec(jpl, ae),
      distance_difference_au:
        vectorLength(ae) - vectorLength(jpl),
      vector_difference_au:
        vectorLength(delta)
    };
  }

  function formatNumber(value) {
    return Number(value).toFixed(12);
  }

  function vectorTable(result) {
    const rows = ["x", "y", "z"].map(axis => `
      <tr>
        <td>${axis.toUpperCase()}</td>
        <td>${formatNumber(result.jpl_vector_au[axis])}</td>
        <td>${formatNumber(result.astronomy_engine_vector_au[axis])}</td>
        <td>${formatNumber(result.delta_ae_minus_jpl_au[axis])}</td>
      </tr>
    `).join("");

    return `
      <table>
        <thead>
          <tr>
            <th>成分</th>
            <th>JPL (AU)</th>
            <th>Astronomy Engine (AU)</th>
            <th>AE - JPL (AU)</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="metric">
        方向の差<br>
        <strong>${result.direction_difference_arcsec.toFixed(6)} 秒角</strong>
      </div>
      <div class="metric">
        距離の差<br>
        <strong>${result.distance_difference_au.toExponential(8)} AU</strong>
      </div>
      <div class="metric">
        ベクトル差の大きさ<br>
        <strong>${result.vector_difference_au.toExponential(8)} AU</strong>
      </div>
    `;
  }

  try {
    if (!window.Astronomy) {
      throw new Error("Astronomy Engineが読み込まれていません。");
    }

    const Astronomy = window.Astronomy;

    if (
      typeof Astronomy.MakeTime !== "function" ||
      typeof Astronomy.HelioVector !== "function"
    ) {
      throw new Error("必要なAstronomy Engine APIが見つかりません。");
    }

    const time = Astronomy.MakeTime(utcDate);

    // 太陽中心ベクトルを個別に取得
    const aeNeptuneRaw = Astronomy.HelioVector(
      Astronomy.Body.Neptune,
      time
    );

    const aeEarthRaw = Astronomy.HelioVector(
      Astronomy.Body.Earth,
      time
    );

    const aeNeptune = {
      x: aeNeptuneRaw.x,
      y: aeNeptuneRaw.y,
      z: aeNeptuneRaw.z
    };

    const aeEarth = {
      x: aeEarthRaw.x,
      y: aeEarthRaw.y,
      z: aeEarthRaw.z
    };

    // Astronomy Engine側の地球中心・海王星ベクトル
    const aeGeocentric = subtractVectors(aeNeptune, aeEarth);

    // JPL側の地球中心・海王星ベクトル
    const jplGeocentricFromHelio =
      subtractVectors(jplNeptune, jplEarth);

    // 個別比較
    const neptuneComparison =
      compareVectors(jplNeptune, aeNeptune);

    const earthComparison =
      compareVectors(jplEarth, aeEarth);

    // 地球中心ベクトル比較
    const geocentricComparison =
      compareVectors(jplGeocentric, aeGeocentric);

    // JPLの個別ベクトルを引いた結果と、
    // JPLの直接取得値との整合性確認
    const jplSubtractionCheck = subtractVectors(
      jplGeocentricFromHelio,
      jplGeocentric
    );

    document.getElementById("neptune").innerHTML =
      vectorTable(neptuneComparison);

    document.getElementById("earth").innerHTML =
      vectorTable(earthComparison);

    document.getElementById("geocentric").innerHTML =
      vectorTable(geocentricComparison);

    const output = {
      test_name: "JPL and Astronomy Engine heliocentric vector comparison",
      epoch_tdb: "2026-12-14 03:00:00",
      astronomy_engine_utc_input: utcDate.toISOString(),
      jpl_frame: "ICRF",
      astronomy_engine_frame: "EQJ",
      correction: "GEOMETRIC / no light-time / no aberration",
      note: "ICRF and EQJ frame difference is not corrected. UTC conversion uses approximate TDB-UTC offset.",
      neptune: neptuneComparison,
      earth: earthComparison,
      geocentric: {
        jpl_vector_from_heliocentric_subtraction_au:
          jplGeocentricFromHelio,
        jpl_direct_vector_au: jplGeocentric,
        jpl_subtraction_check_delta_au: jplSubtractionCheck,
        comparison: geocentricComparison
      }
    };

    document.getElementById("json").textContent =
      JSON.stringify(output, null, 2);

    status.textContent = "計算完了！すべての比較データを取得できました。";

  } catch (error) {
    status.className = "status error";
    status.textContent = "エラー：" + error.message;
    document.getElementById("json").textContent =
      error.stack || error.message;
  }
})();
</script>

</body>
</html>
