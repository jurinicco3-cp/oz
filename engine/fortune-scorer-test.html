
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fortune Scorer Test</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
      line-height: 1.7;
      color: #333;
    }

    h1, h2 {
      border-bottom: 1px solid #ddd;
      padding-bottom: 8px;
    }

    .status {
      padding: 12px;
      border-radius: 6px;
      margin: 12px 0;
      background: #f1f1f1;
    }

    .success {
      background: #e6f5e9;
      color: #17652b;
    }

    .error {
      background: #fdeaea;
      color: #a32020;
    }

    pre {
      background: #f5f5f5;
      padding: 16px;
      border-radius: 6px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px 0;
    }
  </style>
</head>

<body>

  <h1>運勢スコア計算テスト</h1>

  <p>
    fortune-scorer.js の基本計算機能を確認します。
  </p>

  <button id="runTest">テストを実行する</button>

  <h2>テスト結果</h2>
  <div id="status" class="status">
    まだテストは実行されていません。
  </div>

  <pre id="output">テスト待機中...</pre>

  <script type="module">
    import { loadConfigs } from "./config-loader.js";

    import {
      calculateFortuneScores
    } from "./fortune-scorer.js";

    import {
      calculateAllHouses
    } from "./house-calculator.js";


    const statusElement = document.getElementById("status");
    const outputElement = document.getElementById("output");
    const button = document.getElementById("runTest");


    function assert(condition, message) {
      if (!condition) {
        throw new Error(message);
      }
    }


    async function runTest() {

      const results = {
        testCount: 0,
        passed: 0,
        failed: 0,
        tests: [],
        scoreSummary: null,
        sampleScores: null,
        fortuneScores: null
      };


      function test(name, callback) {
        results.testCount++;

        try {
          callback();

          results.passed++;

          results.tests.push({
            name,
            result: "PASS"
          });

        } catch (error) {

          results.failed++;

          results.tests.push({
            name,
            result: "FAIL",
            error: error.message
          });
        }
      }


      try {

        // 1. 設定ファイルを読み込む
        const configs = await loadConfigs();


        // 2. テスト用の天体位置を作成
        const positions = {
          datetime: new Date().toISOString(),

          planets: {
            sun: {
              sign_index: 0
            },
            moon: {
              sign_index: 2
            },
            mercury: {
              sign_index: 3
            },
            venus: {
              sign_index: 4
            },
            mars: {
              sign_index: 5
            },
            jupiter: {
              sign_index: 6
            },
            saturn: {
              sign_index: 7
            },
            uranus: {
              sign_index: 8
            },
            neptune: {
              sign_index: 9
            },
            pluto: {
              sign_index: 10
            }
          }
        };


        // 3. 12星座分のハウス情報を作成
        const houses = calculateAllHouses(positions);


        // 4. テスト用のアスペクト状態を作成
        const states = [
          {
            planetA: "sun",
            planetB: "moon",
            aspectType: "conjunction",
            orb: 1.2,
            motion: "applying"
          },
          {
            planetA: "mercury",
            planetB: "venus",
            aspectType: "trine",
            orb: 2.0,
            motion: "separating"
          },
          {
            planetA: "mars",
            planetB: "saturn",
            aspectType: "square",
            orb: 3.0,
            motion: "applying"
          },
          {
            planetA: "jupiter",
            planetB: "uranus",
            aspectType: "sextile",
            orb: 1.5,
            motion: "separating"
          },
          {
            planetA: "neptune",
            planetB: "pluto",
            aspectType: "opposition",
            orb: 4.0,
            motion: "applying"
          }
        ];


        // 5. fortuneData を作成
        const fortuneData = {
          datetime: positions.datetime,
          states,
          houses
        };


        // 6. スコアを計算
        const fortuneScores = calculateFortuneScores(
          fortuneData,
          configs
        );


        // 7. 基本テスト
        test(
          "設定ファイルの読み込み",
          () => {
            assert(
              configs.scoringRules &&
              configs.signs &&
              configs.planets &&
              configs.aspects &&
              configs.houses &&
              configs.fortuneCategories,
              "必要な設定ファイルがそろっていません"
            );
          }
        );


        test(
          "12星座分のスコアが作成されている",
          () => {
            assert(
              fortuneScores.signs.length === 12,
              "星座数が12ではありません"
            );
          }
        );


        test(
          "4カテゴリがすべて存在する",
          () => {
            const categories = [
              "overall",
              "love",
              "money",
              "work"
            ];

            for (const sign of fortuneScores.signs) {
              for (const category of categories) {
                assert(
                  sign.categories[category],
                  `${sign.signId} の ${category} がありません`
                );
              }
            }
          }
        );


        test(
          "合計48個のカテゴリスコアが作成されている",
          () => {
            const count = fortuneScores.signs.reduce(
              (sum, sign) =>
                sum + Object.keys(sign.categories).length,
              0
            );

            assert(
              count === 48,
              `カテゴリスコア数が48ではありません: ${count}`
            );
          }
        );


        test(
          "影響度が0〜100の範囲内",
          () => {
            for (const sign of fortuneScores.signs) {
              for (const category of Object.values(sign.categories)) {
                assert(
                  Number.isFinite(category.influence) &&
                  category.influence >= 0 &&
                  category.influence <= 100,
                  "影響度が範囲外です"
                );
              }
            }
          }
        );


        test(
          "好調度が0〜100の範囲内",
          () => {
            for (const sign of fortuneScores.signs) {
              for (const category of Object.values(sign.categories)) {
                assert(
                  Number.isFinite(category.favorability) &&
                  category.favorability >= 0 &&
                  category.favorability <= 100,
                  "好調度が範囲外です"
                );
              }
            }
          }
        );


        test(
          "金運が独立した1カテゴリとして存在する",
          () => {
            for (const sign of fortuneScores.signs) {
              assert(
                sign.categories.money,
                "金運がありません"
              );

              assert(
                !sign.categories.income &&
                !sign.categories.investment &&
                !sign.categories.fortune &&
                !sign.categories.gambling &&
                !sign.categories.assets,
                "金運のサブカテゴリが独立して作られています"
              );
            }
          }
        );


        test(
          "星座IDと星座名が設定されている",
          () => {
            for (const sign of fortuneScores.signs) {
              assert(
                sign.signId && sign.signName,
                "星座情報が不足しています"
              );
            }
          }
        );

                // 8. 惑星の重みが影響度に反映されるか確認
        test(
          "惑星の重みを変更すると影響度も変化する",
          () => {
            const originalWeight =
              configs.scoringRules.planet_weights.sun;

            try {
              const originalScores =
                calculateFortuneScores(fortuneData, configs);

              const originalInfluence =
                originalScores.signs[0].categories.overall.influence;

              configs.scoringRules.planet_weights.sun =
                originalWeight * 2;

              const changedScores =
                calculateFortuneScores(fortuneData, configs);

              const changedInfluence =
                changedScores.signs[0].categories.overall.influence;

              assert(
                changedInfluence > originalInfluence,
                `太陽の重みを2倍にしましたが、影響度が上昇しませんでした。変更前: ${originalInfluence}、変更後: ${changedInfluence}`
              );

            } finally {
              configs.scoringRules.planet_weights.sun =
                originalWeight;
            }
          }
        );

        // 9. 最大オーブでは影響度が0になるか確認
test(
  "最大オーブのアスペクトは影響度に加算されない",
  () => {
    const testData = {
      ...fortuneData,
      states: fortuneData.states.map(state => {
        const aspect = configs.aspects.aspects.find(
          item => item.id === state.aspectType
        );

        return {
          ...state,
          orb: aspect.default_orb_degrees
        };
      })
    };

    const result = calculateFortuneScores(
      testData,
      configs
    );

    result.signs.forEach(sign => {
  Object.entries(sign.categories).forEach(([categoryName, category]) => {
    assert(
      category.influence === 0,
      `${sign.signName}の${categoryName}の影響度が0ではありません。値: ${category.influence}`
    );
  });
});
  }
);

        
        // 11. 同じ天体配置でも星座によってハウスが変わるか確認
        test(
          "同じ月の位置でも星座によってハウスが変わる",
          () => {
            const ariesMoonHouse =
              houses[0].planets.moon.house;

            const taurusMoonHouse =
              houses[1].planets.moon.house;

            assert(
              ariesMoonHouse === 3,
              `牡羊座基準の月が3ハウスではありません: ${ariesMoonHouse}`
            );

            assert(
              taurusMoonHouse === 2,
              `牡牛座基準の月が2ハウスではありません: ${taurusMoonHouse}`
            );

            assert(
              ariesMoonHouse !== taurusMoonHouse,
              "星座を変えても月のハウスが変わっていません"
            );
          }
        );


        // 12. ハウスの重みが影響度に反映されるか確認
        test(
          "ハウスの重みを変えると影響度も変化する",
          () => {
            const testConfigs = JSON.parse(
              JSON.stringify(configs)
            );

            // 太陽と水星だけが影響する条件にする
            for (const planet of Object.keys(
              testConfigs.scoringRules.planet_weights
            )) {
              testConfigs.scoringRules.planet_weights[planet] = 0;
            }

            testConfigs.scoringRules.planet_weights.sun = 1;
            testConfigs.scoringRules.planet_weights.mercury = 1;

            // すべてのハウスの重みを同じにする
            for (let house = 1; house <= 12; house++) {
              testConfigs.scoringRules.house_weights[String(house)] = 1;
            }

            const controlledData = {
              ...fortuneData,
              states: [
                {
                  planetA: "sun",
                  planetB: "moon",
                  aspectType: "conjunction",
                  orb: 1.2,
                  motion: "applying"
                },
                {
                  planetA: "mercury",
                  planetB: "venus",
                  aspectType: "trine",
                  orb: 2.0,
                  motion: "separating"
                }
              ]
            };

            const originalScores = calculateFortuneScores(
              controlledData,
              testConfigs
            );

            const originalInfluence =
              originalScores.signs[0].categories.overall.influence;

            // 太陽がいる1ハウスの重みだけを2倍にする
            testConfigs.scoringRules.house_weights["1"] = 2;

            const changedScores = calculateFortuneScores(
              controlledData,
              testConfigs
            );

            const changedInfluence =
              changedScores.signs[0].categories.overall.influence;

            assert(
              changedInfluence !== originalInfluence,
              `ハウスの重みを変更しても影響度が変わりませんでした。変更前: ${originalInfluence}、変更後: ${changedInfluence}`
            );
          }
        );

        
        // 8. スコアのサンプルを取得
        const aries = fortuneScores.signs[0];


        // 9. 結果をまとめる
        results.scoreSummary = {
          signCount: fortuneScores.signs.length,
          categoryCount: 4,
          totalScores: fortuneScores.signs.length * 4
        };

        results.sampleScores = {
          sign: aries.signName,
          categories: aries.categories
        };

        results.fortuneScores = fortuneScores;


        // 10. 表示
        statusElement.className =
          results.failed === 0
            ? "status success"
            : "status error";

        statusElement.textContent =
          `テスト終了：${results.passed}件成功 / ${results.failed}件失敗`;


        outputElement.textContent =
          JSON.stringify(results, null, 2);


      } catch (error) {

        statusElement.className = "status error";

        statusElement.textContent =
          "テスト実行中にエラーが発生しました。";

        outputElement.textContent =
          error.stack || error.message;

      }
    }


    button.addEventListener("click", runTest);

  </script>

</body>
</html>
