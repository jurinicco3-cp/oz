
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fortune Integration Test</title>
</head>
<body>
  <h1>占いエンジン統合テスト</h1>
  <pre id="results">テスト準備中...</pre>

  <script type="module">
    import { buildFortuneData } from "./fortune-engine.js";

    const results = document.getElementById("results");
    const checks = [];

    function test(name, callback) {
      try {
        callback();
        checks.push("PASS: " + name);
      } catch (error) {
        checks.push("FAIL: " + name + " - " + error.message);
      }
    }

    function assert(condition, message) {
      if (!condition) throw new Error(message);
    }

    async function loadConfig(file) {
      const response = await fetch("../config/" + file);

      if (!response.ok) {
        throw new Error("設定ファイルを読み込めません: " + file);
      }

      return response.json();
    }

    async function runTests() {
      results.textContent = "設定ファイルを読み込み中...";

      try {
        const [
          signs,
          aspectsConfig,
          scoringRules,
          interpretationRules,
          planetCombinations
        ] = await Promise.all([
          loadConfig("signs.json"),
          loadConfig("aspects.json"),
          loadConfig("scoring-rules.json"),
          loadConfig("interpretation-rules.json"),
          loadConfig("planet-combinations.json")
        ]);

        const configs = {
          signs,
          aspects: aspectsConfig,
          scoringRules,
          interpretationRules,
          planetCombinations
        };

        const positions = {
          datetime: "2026-11-27T12:00:00.000Z",
          planets: {
            sun: { sign_index: 8 },
            moon: { sign_index: 2 },
            mercury: { sign_index: 8 },
            venus: { sign_index: 9 },
            mars: { sign_index: 6 },
            jupiter: { sign_index: 3 },
            saturn: { sign_index: 0 },
            uranus: { sign_index: 1 },
            neptune: { sign_index: 11 },
            pluto: { sign_index: 9 }
          }
        };

        const aspects = [{
          planetA: "moon",
          planetB: "venus",
          aspectType: "trine",
          orb: 2,
          applying: true
        }];

        let data = null;

        test("占いエンジンの実行", () => {
          data = buildFortuneData(
            aspects,
            positions,
            configs
          );

          assert(data !== null, "結果がありません");
        });

        test("12星座のハウス情報", () => {
          assert(
            Object.keys(data.houses).length === 12,
            "12星座分のハウス情報がありません"
          );
        });

        test("アスペクト状態の生成", () => {
          assert(data.states.length === 1, "状態数が一致しません");
        });

        test("12星座の運勢スコア", () => {
          assert(data.scores.length === 12, "12星座分のスコアがありません");
        });

        test("4カテゴリーのスコア", () => {
          const firstSign = data.scores[0];

          for (const category of ["overall", "love", "money", "work"]) {
            assert(
              firstSign.categories[category] !== undefined,
              category + "のスコアがありません"
            );
          }
        });

        test("占星術的な解釈の生成", () => {
          assert(
            data.interpretations.length === 1,
            "解釈データがありません"
          );
        });

        test("4カテゴリーのアドバイスデータ", () => {
          assert(
            data.adviceData.summary.categoryCount === 4,
            "カテゴリー数が一致しません"
          );
        });

        test("4カテゴリーの文章生成", () => {
          for (const category of ["overall", "love", "money", "work"]) {
            assert(
              data.advice.advice[category].mainAdvice.length > 0,
              category + "の文章がありません"
            );
          }
        });

        test("注意点と行動提案の生成", () => {
          for (const category of ["overall", "love", "money", "work"]) {
            const advice = data.advice.advice[category];

            assert(advice.caution.length > 0, "注意点がありません");
            assert(advice.action.length > 0, "行動提案がありません");
          }
        });

        test("統合結果のサマリー", () => {
          assert(data.summary.signCount === 12, "星座数が違います");
          assert(data.summary.interpretationCount === 1, "解釈数が違います");
          assert(data.summary.adviceCategoryCount === 4, "アドバイス数が違います");
        });

        const passed = checks.filter(
          item => item.startsWith("PASS")
        ).length;

        const failed = checks.length - passed;

        results.textContent =
          checks.join("\n") +
          "\n\n結果: " + passed + "/" + checks.length + " PASS" +
          "\n失敗: " + failed;

        if (data) {
          results.textContent +=
            "\n\n--- 生成データの確認 ---" +
            "\n日時: " + data.datetime +
            "\n星座数: " + data.scores.length +
            "\n解釈数: " + data.interpretations.length +
            "\nアドバイスカテゴリー数: " +
            data.advice.summary.categoryCount;
        }

      } catch (error) {
        results.textContent =
          "テスト実行エラー\n" + error.stack;
      }
    }

    runTests();
  </script>
</body>
</html>
