
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>時間帯別スケジュール総合テスト</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 950px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.7;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    pre {
      background: #f3f3f3;
      padding: 16px;
      overflow-x: auto;
      white-space: pre-wrap;
    }

    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>

  <h1>時間帯別スケジュール総合テスト</h1>

  <p>
    天体位置、アスペクト、12星座の運勢スコアが
    時間帯ごとに計算できるか確認します。
  </p>

  <button id="run-test">テストを実行</button>

  <h2>実行結果</h2>
  <div id="status">まだ実行されていません。</div>
  <pre id="result"></pre>

  <script src="../astronomy/astronomy.browser.min.js"></script>
  <script src="./position-calculator.js"></script>
  <script src="./aspect-detector.js"></script>

  <script type="module">
    import { buildScheduleBase } from "./schedule-engine.js";
    import { loadConfigs } from "./config-loader.js";

    const status = document.getElementById("status");
    const result = document.getElementById("result");

    document.getElementById("run-test").addEventListener("click", async () => {
      try {
        status.className = "";
        status.textContent = "設定ファイルを読み込んでいます...";
        result.textContent = "";

        const configs = await loadConfigs();

        const startTime = "2026-11-22T00:00:00+09:00";
        const endTime = "2026-11-23T00:00:00+09:00";

        const events = [
          {
            exactTime: "2026-11-22T08:00:00+09:00"
          },
          {
            exactTime: "2026-11-22T16:00:00+09:00"
          }
        ];

        const calculatePositions = date =>
          window.PositionCalculator.calculatePositions(date);

        const schedule = buildScheduleBase(
          startTime,
          endTime,
          events,
          calculatePositions,
          window.AspectDetector,
          configs
        );

        const checks = [];

        // 1. 時間帯が3つ作成される
        checks.push({
          name: "時間帯が3つ作成される",
          passed: schedule.blockCount === 3,
          actual: schedule.blockCount
        });

        // 2. 各時間帯で10天体が取得できる
        const planetCheck = schedule.blocks.every(
          block =>
            block.positions &&
            Object.keys(block.positions.planets).length === 10
        );

        checks.push({
          name: "各時間帯で10天体の位置を取得できる",
          passed: planetCheck
        });

        // 3. アスペクトが配列として作成される
        const aspectCheck = schedule.blocks.every(
          block =>
            Array.isArray(block.aspects) &&
            block.aspects.length <= 45 &&
            block.aspects.every(aspect =>
              typeof aspect.planetA === "string" &&
              typeof aspect.planetB === "string" &&
              typeof aspect.aspectType === "string" &&
              typeof aspect.orb === "number" &&
              typeof aspect.applying === "boolean"
            )
        );

        checks.push({
          name: "アスペクトが正しい形式で検出される",
          passed: aspectCheck
        });

        // 4. 12星座分のスコアが作成される
        const scoreCheck = schedule.blocks.every(
          block =>
            block.fortuneData &&
            block.fortuneData.summary &&
            block.fortuneData.summary.scoreSignCount === 12
        );

        checks.push({
          name: "各時間帯で12星座分のスコアが作成される",
          passed: scoreCheck
        });

        // 5. 4カテゴリー分のスコアが作成される
        const categoryCheck = schedule.blocks.every(
          block =>
            block.fortuneData.summary.scoreCategoryCount === 4
        );

        checks.push({
          name: "各時間帯で4カテゴリーのスコアが作成される",
          passed: categoryCheck
        });

        const passed = checks.filter(
          item => item.passed
        ).length;

        const failed = checks.length - passed;

        status.className = failed === 0
          ? "success"
          : "error";

        status.textContent =
          `テスト結果: ${checks.length}件中 ${passed}件合格、${failed}件失敗`;

        result.textContent = JSON.stringify({
          checks,
          schedule: {
            startTime: schedule.startTime,
            endTime: schedule.endTime,
            blockCount: schedule.blockCount,
            blocks: schedule.blocks.map(block => ({
              id: block.id,
              startTime: block.startTime,
              endTime: block.endTime,
              midpoint: block.midpoint,
              planetCount: Object.keys(
                block.positions.planets
              ).length,
              aspectCount: block.aspects.length,
              aspects: block.aspects,
              fortuneSummary: block.fortuneData.summary,
              firstSignScores: block.fortuneData.scores[0]
            }))
          }
        }, null, 2);

      } catch (error) {
        status.className = "error";
        status.textContent = "エラーが発生しました。";
        result.textContent = error.stack || error.message;
      }
    });
  </script>

</body>
</html>
