
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>時間帯別スケジュール総合テスト</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 950px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.7;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    pre {
      background: #f3f3f3;
      padding: 16px;
      overflow-x: auto;
      white-space: pre-wrap;
    }

    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>

  <h1>時間帯別スケジュール総合テスト</h1>

  <p>
    日本時間の1日を対象に、天体イベントの自動検出、
    時間帯の分割、12星座の運勢計算を確認します。
  </p>

  <button id="run-test">テストを実行</button>

  <h2>実行結果</h2>
  <div id="status">まだ実行されていません。</div>
  <pre id="result"></pre>

  <script src="../astronomy/astronomy.browser.min.js"></script>
  <script src="./position-calculator.js"></script>
  <script src="./aspect-detector.js"></script>

  <script type="module">
    import { buildScheduleBase } from "./schedule-engine.js";
    import { loadConfigs } from "./config-loader.js";

    const status = document.getElementById("status");
    const result = document.getElementById("result");

    document.getElementById("run-test").addEventListener("click", async () => {
      try {
        status.className = "";
        status.textContent = "設定ファイルを読み込んでいます...";
        result.textContent = "";

        const configs = await loadConfigs();

        const startTime = "2026-11-22T00:00:00+09:00";
        const endTime = "2026-11-23T00:00:00+09:00";

        const calculatePositions = date =>
          window.PositionCalculator.calculatePositions(date);

        status.textContent =
          "天体イベントを検索してスケジュールを計算しています...";

        const schedule = buildScheduleBase(
          startTime,
          endTime,
          calculatePositions,
          window.AspectDetector,
          configs
        );

        const checks = [];

        // 1. 指定した日本時間の1日が設定されている
        checks.push({
          name: "日本時間の1日が正しく設定される",
          passed:
            schedule.startTime ===
              "2026-11-21T15:00:00.000Z" &&
            schedule.endTime ===
              "2026-11-22T15:00:00.000Z"
        });

        // 2. イベントが配列として作成される
        checks.push({
          name: "天体イベントが配列として作成される",
          passed: Array.isArray(schedule.events)
        });

        // 3. イベントの時刻と天体情報が正しい
        const eventCheck = schedule.events.every(event =>
          typeof event.planetA === "string" &&
          typeof event.planetB === "string" &&
          typeof event.aspectType === "string" &&
          typeof event.exactTime === "string" &&
          typeof event.orb === "number" &&
          Number.isFinite(new Date(event.exactTime).getTime())
        );

        checks.push({
          name: "イベントの情報と発生時刻が正しい",
          passed: eventCheck
        });

        // 4. 時間帯が1つ以上作成される
        checks.push({
          name: "時間帯が1つ以上作成される",
          passed:
            schedule.blockCount > 0 &&
            schedule.blockCount === schedule.blocks.length
        });

        // 5. 時間帯の開始・終了が連続している
        const boundaryCheck = schedule.blocks.every(
          (block, index) => {
            if (index === 0) {
              return block.startTime === schedule.startTime;
            }

            return (
              block.startTime ===
              schedule.blocks[index - 1].endTime
            );
          }
        );

        checks.push({
          name: "時間帯の境界が連続している",
          passed:
            boundaryCheck &&
            schedule.blocks[
              schedule.blocks.length - 1
            ].endTime === schedule.endTime
        });

        // 6. 各時間帯で10天体が取得できる
        const planetCheck = schedule.blocks.every(
          block =>
            block.positions &&
            Object.keys(block.positions.planets).length === 10
        );

        checks.push({
          name: "各時間帯で10天体の位置を取得できる",
          passed: planetCheck
        });

        // 7. アスペクト情報が正しい形式で作成される
        const aspectCheck = schedule.blocks.every(
          block =>
            Array.isArray(block.aspects) &&
            block.aspects.length <= 45 &&
            block.aspects.every(aspect =>
              typeof aspect.planetA === "string" &&
              typeof aspect.planetB === "string" &&
              typeof aspect.aspectType === "string" &&
              typeof aspect.orb === "number" &&
              typeof aspect.applying === "boolean"
            )
        );

        checks.push({
          name: "時間帯ごとのアスペクト情報が正しい",
          passed: aspectCheck
        });

        // 8. 12星座分のスコアが作成される
        const scoreCheck = schedule.blocks.every(
          block =>
            block.fortuneData &&
            block.fortuneData.summary &&
            block.fortuneData.summary.scoreSignCount === 12
        );

        checks.push({
          name: "各時間帯で12星座分のスコアが作成される",
          passed: scoreCheck
        });

        // 9. 4カテゴリー分のスコアが作成される
        const categoryCheck = schedule.blocks.every(
          block =>
            block.fortuneData.summary.scoreCategoryCount === 4
        );

        checks.push({
          name: "各時間帯で4カテゴリーのスコアが作成される",
          passed: categoryCheck
        });

        // 10. 天体位置の計算回数が記録される
        checks.push({
          name: "天体位置の計算回数が記録される",
          passed:
            Number.isInteger(schedule.positionCalculationCount) &&
            schedule.positionCalculationCount > 0
        });

        // 11. 検出されたイベントが運勢データにも反映される
        const eventIntegrationCheck = schedule.blocks.every(
          block =>
            block.fortuneData &&
            block.fortuneData.events.length === schedule.eventCount &&
            block.fortuneData.summary.eventCount === schedule.eventCount
        );
        
        checks.push({
          name: "検出されたイベントが運勢データにも反映される",
          passed: eventIntegrationCheck
        });

        const passed = checks.filter(
          item => item.passed
        ).length;

        const failed = checks.length - passed;

        status.className = failed === 0
          ? "success"
          : "error";

        status.textContent =
          `テスト結果: ${checks.length}件中 ${passed}件合格、${failed}件失敗`;

        result.textContent = JSON.stringify({
          checks,
          schedule: {
            startTime: schedule.startTime,
            endTime: schedule.endTime,
            eventCount: schedule.eventCount,
            positionCalculationCount:
              schedule.positionCalculationCount,
            blockCount: schedule.blockCount,
            events: schedule.events,
            blocks: schedule.blocks.map(block => ({
              id: block.id,
              startTime: block.startTime,
              endTime: block.endTime,
              midpoint: block.midpoint,
              planetCount: Object.keys(
                block.positions.planets
              ).length,
              aspectCount: block.aspects.length,
              fortuneSummary: block.fortuneData.summary,
              firstSignScores: block.fortuneData.scores[0]
            }))
          }
        }, null, 2);

      } catch (error) {
        status.className = "error";
        status.textContent = "エラーが発生しました。";
        result.textContent = error.stack || error.message;
      }
    });
  </script>

</body>
</html>
