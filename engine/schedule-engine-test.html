
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule Engine Test</title>
</head>
<body>
  <h1>Schedule Engine Test</h1>
  <pre id="results">テスト実行中...</pre>

  <script src="../astronomy/astronomy.browser.min.js"></script>
  <script src="./position-calculator.js"></script>
  <script src="./aspect-detector.js"></script>

  <script type="module">
    import { buildScheduleBase } from "./schedule-engine.js";
    import { loadConfigs } from "./config-loader.js";

    const resultsElement = document.getElementById("results");

    async function runTests() {
      const checks = [];

      try {
        const startTime = "2026-11-29T00:00:00+09:00";
const endTime = "2026-11-30T00:00:00+09:00";

        const configs = await loadConfigs("../config/");

        const schedule = buildScheduleBase(
          startTime,
          endTime,
          window.PositionCalculator.calculatePositions,
          window.AspectDetector,
          configs
        );

        // 1. 日本時間の1日が正しく設定される
        checks.push({
          name: "日本時間の1日が正しく設定される",
          passed:
            schedule.startTime === "2026-11-21T15:00:00.000Z" &&
            schedule.endTime === "2026-11-22T15:00:00.000Z"
        });

        // 2. 天体イベントが配列として作成される
        checks.push({
          name: "天体イベントが配列として作成される",
          passed: Array.isArray(schedule.events)
        });

        // 3. イベントの情報と発生時刻が正しい
        const eventShapeCheck = schedule.events.every(event =>
          typeof event.planetA === "string" &&
          typeof event.planetB === "string" &&
          typeof event.aspectType === "string" &&
          typeof event.orb === "number" &&
          typeof event.exactTime === "string" &&
          !Number.isNaN(new Date(event.exactTime).getTime())
        );

        checks.push({
          name: "イベントの情報と発生時刻が正しい",
          passed: eventShapeCheck
        });

        // 4. 時間帯が1つ以上作成される
        checks.push({
          name: "時間帯が1つ以上作成される",
          passed:
            Array.isArray(schedule.blocks) &&
            schedule.blocks.length > 0
        });

        // 5. 時間帯の境界が連続している
        const boundaryCheck = schedule.blocks.every((block, index) => {
          if (index === 0) {
            return block.startTime === schedule.startTime;
          }

          return (
            schedule.blocks[index - 1].endTime === block.startTime
          );
        }) &&
        schedule.blocks[schedule.blocks.length - 1].endTime ===
          schedule.endTime;

        checks.push({
          name: "時間帯の境界が連続している",
          passed: boundaryCheck
        });

        // 6. 各時間帯で10天体の位置を取得できる
        const planetPositionCheck = schedule.blocks.every(block =>
          block.positions &&
          block.positions.planets &&
          Object.keys(block.positions.planets).length === 10
        );

        checks.push({
          name: "各時間帯で10天体の位置を取得できる",
          passed: planetPositionCheck
        });

        // 7. 時間帯ごとのアスペクト情報が正しい
        const aspectCheck = schedule.blocks.every(block =>
          Array.isArray(block.aspects) &&
          block.aspects.every(aspect =>
            typeof aspect.planetA === "string" &&
            typeof aspect.planetB === "string" &&
            typeof aspect.aspectType === "string" &&
            typeof aspect.orb === "number" &&
            typeof aspect.applying === "boolean"
          )
        );

        checks.push({
          name: "時間帯ごとのアスペクト情報が正しい",
          passed: aspectCheck
        });

        // 8. 各時間帯で12星座分のスコアが作成される
        const signScoreCheck = schedule.blocks.every(block =>
          block.fortuneData &&
          Array.isArray(block.fortuneData.scores) &&
          block.fortuneData.scores.length === 12
        );

        checks.push({
          name: "各時間帯で12星座分のスコアが作成される",
          passed: signScoreCheck
        });

        // 9. 各時間帯で4カテゴリーのスコアが作成される
        const categoryCheck = schedule.blocks.every(block =>
          block.fortuneData.scores.every(sign =>
            sign.categories &&
            Object.keys(sign.categories).length === 4
          )
        );

        checks.push({
          name: "各時間帯で4カテゴリーのスコアが作成される",
          passed: categoryCheck
        });

        // 10. 天体位置の計算回数が記録される
        checks.push({
          name: "天体位置の計算回数が記録される",
          passed:
            Number.isInteger(schedule.positionCalculationCount) &&
            schedule.positionCalculationCount > 0
        });

        // 11. イベントが正しい時間帯に振り分けられる
        
// 11. イベントが正しい時間帯に振り分けられる
const eventIntegrationCheck =
  schedule.blocks.every(block => {
    const blockEvents = block.events;
    const fortuneEvents = block.fortuneData.events;

    return (
      blockEvents.length === fortuneEvents.length &&
      blockEvents.length === block.fortuneData.summary.eventCount &&
      blockEvents.every((event, index) => {
        const fortuneEvent = fortuneEvents[index];

        return (
          event.planetA === fortuneEvent.planetA &&
          event.planetB === fortuneEvent.planetB &&
          event.aspectType === fortuneEvent.aspectType &&
          event.exactTime === fortuneEvent.exactTime
        );
      })
    );
  }) &&
  schedule.blocks.reduce(
    (total, block) => total + block.events.length,
    0
  ) === schedule.eventCount;

checks.push({
  name: "イベントが正しい時間帯に振り分けられる",
  passed: eventIntegrationCheck,
  actual: schedule.blocks.map(block => ({
    block: block.id,
    eventCount: block.events.length
  }))
});

        const passedCount = checks.filter(check => check.passed).length;

        resultsElement.textContent =
          "テスト結果: " +
          checks.length +
          "件中 " +
          passedCount +
          "件合格、" +
          (checks.length - passedCount) +
          "件失敗\n\n" +
          JSON.stringify({
            checks,
            scheduleSummary: {
              eventCount: schedule.eventCount,
              blockCount: schedule.blockCount,
              positionCalculationCount:
                schedule.positionCalculationCount
            },
            events: schedule.events,
            blocks: schedule.blocks.map(block => ({
              id: block.id,
              startTime: block.startTime,
              endTime: block.endTime,
              eventCount: block.events.length
            }))
          }, null, 2);

      } catch (error) {
        resultsElement.textContent =
          "テスト実行中にエラーが発生しました:\n\n" +
          error.stack;
      }
    }

    runTests();
  </script>
</body>
</html>
