<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>占星術エンジン動作テスト</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.7;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    pre {
      background: #f3f3f3;
      padding: 16px;
      overflow-x: auto;
      white-space: pre-wrap;
    }

    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>

  <h1>占星術エンジン動作テスト</h1>

  <p>天体位置・アスペクト・接近と分離の判定を確認します。</p>

  <button id="run-test">テストを実行</button>

  <h2>実行結果</h2>
  <div id="status">まだ実行されていません。</div>
  <pre id="result"></pre>

  <script src="../astronomy/astronomy.browser.min.js"></script>
  <script src="./position-calculator.js"></script>
  <script src="./aspect-detector.js"></script>

  <script type="module">
    import { buildEvents } from "./event-builder.js";

    const status = document.getElementById("status");
    const result = document.getElementById("result");

    document.getElementById("run-test").addEventListener("click", () => {
      try {
        const now = new Date();

        const future = new Date(
          now.getTime() + 24 * 60 * 60 * 1000
        );

        const currentPositions =
          window.PositionCalculator.calculatePositions(now);

        const futurePositions =
          window.PositionCalculator.calculatePositions(future);

        const currentPlanets = currentPositions.planets;
        const futurePlanets = futurePositions.planets;

        const planetNames = Object.keys(currentPlanets);
        const aspects = [];

        for (let i = 0; i < planetNames.length; i++) {
          for (let j = i + 1; j < planetNames.length; j++) {
            const planetA = planetNames[i];
            const planetB = planetNames[j];

            const currentA = currentPlanets[planetA].longitude;
            const currentB = currentPlanets[planetB].longitude;
            const futureA = futurePlanets[planetA].longitude;
            const futureB = futurePlanets[planetB].longitude;

            const detected = window.AspectDetector.detectAspect(
              currentA,
              currentB
            );

            if (!detected) continue;

            const applying = window.AspectDetector.detectApplying(
              currentA,
              currentB,
              futureA,
              futureB,
              detected.aspectType
            );

            aspects.push({
              planetA,
              planetB,
              aspectType: detected.aspectType,
              exactTime: null,
              orb: detected.orb,
              applying
            });
          }
        }

        const events = buildEvents(aspects);

        status.className = "success";
        status.textContent = "テスト成功！";

        result.textContent = JSON.stringify({
          currentDate: currentPositions.datetime,
          futureDate: futurePositions.datetime,
          comparisonHours: 24,
          planetCount: planetNames.length,
          aspectCount: aspects.length,
          applyingCount: aspects.filter(
            item => item.applying === true
          ).length,
          separatingCount: aspects.filter(
            item => item.applying === false
          ).length,
          unchangedCount: aspects.filter(
            item => item.applying === null
          ).length,
          events
        }, null, 2);

      } catch (error) {
        status.className = "error";
        status.textContent = "エラーが発生しました。";
        result.textContent = error.stack || error.message;
      }
    });
  </script>

</body>
</html>
