
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>占星術エンジン統合テスト</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.7;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    pre {
      background: #f3f3f3;
      padding: 16px;
      overflow-x: auto;
      white-space: pre-wrap;
    }

    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>

  <h1>占星術エンジン統合テスト</h1>
  <p>天体位置・アスペクト・イベント・ハウス・12星座の運勢スコアを確認します。</p>

  <button id="run-test">テストを実行</button>

  <h2>実行結果</h2>
  <div id="status">まだ実行されていません。</div>
  <pre id="result"></pre>

  <script src="../astronomy/astronomy.browser.min.js"></script>
  <script src="./position-calculator.js"></script>
  <script src="./aspect-detector.js"></script>

  <script type="module">
    import { buildFortuneData } from "./fortune-engine.js";
    import { loadConfigs } from "./config-loader.js";

    const status = document.getElementById("status");
    const result = document.getElementById("result");

    document.getElementById("run-test").addEventListener("click", async () => {
      try {
        status.className = "";
        status.textContent = "計算中...";
        result.textContent = "";

        // 設定ファイルを読み込む
        const configs = await loadConfigs();

        const now = new Date();

        const future = new Date(
          now.getTime() + 60 * 60 * 1000
        );

        const searchEnd = new Date(
          now.getTime() + 60 * 24 * 60 * 60 * 1000
        );

        const calculatePositions = date =>
          window.PositionCalculator.calculatePositions(date);

        const currentPositions = calculatePositions(now);
        const futurePositions = calculatePositions(future);

        const currentPlanets = currentPositions.planets;
        const futurePlanets = futurePositions.planets;

        const planetNames = Object.keys(currentPlanets);
        const aspects = [];
        const exactAspectSearches = [];

        for (let i = 0; i < planetNames.length; i++) {
          for (let j = i + 1; j < planetNames.length; j++) {
            const planetA = planetNames[i];
            const planetB = planetNames[j];

            const currentA = currentPlanets[planetA].longitude;
            const currentB = currentPlanets[planetB].longitude;

            const futureA = futurePlanets[planetA].longitude;
            const futureB = futurePlanets[planetB].longitude;

            const detected = window.AspectDetector.detectAspect(
              currentA,
              currentB
            );

            if (!detected) continue;

            const applying = window.AspectDetector.detectApplying(
              currentA,
              currentB,
              futureA,
              futureB,
              detected.aspectType
            );

            const searchResult =
              window.AspectDetector.findExactAspectTime(
                now,
                searchEnd,
                planetA,
                planetB,
                detected.aspectType,
                calculatePositions,
                60
              );

            aspects.push({
              planetA,
              planetB,
              aspectType: detected.aspectType,
              exactTime: searchResult.exactTime,
              exactEvents: searchResult.events,
              orb: detected.orb,
              applying
            });

            exactAspectSearches.push(searchResult);
          }
        }

        // 実際の天体配置と設定ファイルから占いデータを作成
        const fortuneData = buildFortuneData(
          aspects,
          currentPositions,
          configs
        );

        const signNames = [
          "牡羊座", "牡牛座", "双子座", "蟹座",
          "獅子座", "乙女座", "天秤座", "蠍座",
          "射手座", "山羊座", "水瓶座", "魚座"
        ];

        const houseChecks = signNames.map((name, index) => {
          const signData = fortuneData.houses[index];
          const planets = signData.planets;

          return {
            sign: name,
            planetCount: Object.keys(planets).length,
            allHousesValid: Object.values(planets).every(
              item =>
                Number.isInteger(item.house) &&
                item.house >= 1 &&
                item.house <= 12
            )
          };
        });

        // 12星座×4カテゴリのスコアを確認
        const scoreChecks = fortuneData.scores.map(sign => ({
          sign: sign.signName,
          categoryCount: Object.keys(sign.categories).length,
          categories: Object.keys(sign.categories),
          allScoresValid: Object.values(sign.categories).every(
            score =>
              Number.isFinite(score.influence) &&
              score.influence >= 0 &&
              score.influence <= 100 &&
              Number.isFinite(score.favorability) &&
              score.favorability >= 0 &&
              score.favorability <= 100
          )
        }));

        const totalScoreCount = fortuneData.scores.reduce(
          (total, sign) =>
            total + Object.keys(sign.categories).length,
          0
        );

        const checksPassed =
          fortuneData.summary.signCount === 12 &&
          fortuneData.summary.planetCount === 10 &&
          fortuneData.summary.scoreSignCount === 12 &&
          fortuneData.summary.scoreCategoryCount === 4 &&
          fortuneData.scores.length === 12 &&
          totalScoreCount === 48 &&
          houseChecks.every(
            item => item.planetCount === 10 && item.allHousesValid
          ) &&
          scoreChecks.every(
            item => item.categoryCount === 4 && item.allScoresValid
          );

        status.className = checksPassed ? "success" : "error";
        status.textContent = checksPassed
          ? "統合テスト成功！"
          : "一部の確認に失敗しました。";

        result.textContent = JSON.stringify({
          currentDate: fortuneData.datetime,
          fortuneSummary: fortuneData.summary,
          totalScoreCount,
          houseChecks,
          scoreChecks,
          ariesExample: {
            houses: fortuneData.houses[0],
            scores: fortuneData.scores[0]
          },
          events: fortuneData.events,
          states: fortuneData.states,
          exactAspectSearches
        }, null, 2);

      } catch (error) {
        status.className = "error";
        status.textContent = "エラーが発生しました。";
        result.textContent = error.stack || error.message;
      }
    });
  </script>

</body>
</html>
