
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天体計算エンジン検証</title>

<script src="../astronomy/astronomy.browser.min.js"></script>

<style>
body {
  font-family: sans-serif;
  background: #10172b;
  color: #f5f0e6;
  padding: 20px;
  line-height: 1.7;
}
h1, h2 {
  color: #e8c779;
}
pre {
  background: #080d19;
  color: #d8e6f5;
  padding: 16px;
  border-radius: 8px;
  overflow-x: auto;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
button {
  background: #d5ae59;
  color: #10172b;
  border: none;
  padding: 12px 20px;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
}
.status {
  color: #8ee0ad;
  font-weight: bold;
}
.error {
  color: #ff9292;
}
</style>
</head>

<body>

<h1>🌙 天体計算エンジン検証</h1>
<p>天体位置・星座移動・アスペクト・ボイドタイムの検証</p>

<button onclick="runTest()">計算を実行</button>

<h2>検証結果</h2>
<pre id="output">計算待機中...</pre>

<script>

// ========================================
// 基本設定
// ========================================

// 固定テスト日時（UTC）
// 必要に応じて変更可能
const now = new Date("2026-11-10T04:24:49.276Z");

// 計算対象の天体
const BODIES = [
  "Sun",
  "Mercury",
  "Venus",
  "Mars",
  "Jupiter",
  "Saturn",
  "Uranus",
  "Neptune",
  "Pluto"
];

// アスペクト角度
const ASPECTS = [0, 60, 90, 120, 180];

// 星座
const SIGNS = [
  "牡羊座",
  "牡牛座",
  "双子座",
  "蟹座",
  "獅子座",
  "乙女座",
  "天秤座",
  "蠍座",
  "射手座",
  "山羊座",
  "水瓶座",
  "魚座"
];

// ========================================
// 共通関数
// ========================================

function normalizeAngle(degree) {
  return ((degree % 360) + 360) % 360;
}

function formatJST(date) {
  return new Intl.DateTimeFormat("ja-JP", {
    timeZone: "Asia/Tokyo",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    weekday: "short",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
  }).format(date);
}

function getZodiac(longitude) {
  const normalized = normalizeAngle(longitude);
  const signIndex = Math.floor(normalized / 30);
  const degreeInSign = normalized % 30;

  const degree = Math.floor(degreeInSign);
  const minute = Math.floor(
    (degreeInSign - degree) * 60
  );

  return {
    sign: SIGNS[signIndex],
    degree,
    minute
  };
}

// ========================================
// 天体黄経取得
// ========================================

function getLongitude(bodyName, date) {

  if (bodyName === "Sun") {
    return Astronomy.SunPosition(date).elon;
  }

  if (bodyName === "Moon") {
    return Astronomy.EclipticGeoMoon(date).lon;
  }

  const vector = Astronomy.GeoVector(
    Astronomy.Body[bodyName],
    date,
    true
  );

  return Astronomy.Ecliptic(vector).elon;
}

function getMoonLongitude(date) {
  return getLongitude("Moon", date);
}

// ========================================
// 月の星座移動時刻
// ========================================


function findNextIngress(startDate) {

  const startLongitude = normalizeAngle(
    getMoonLongitude(startDate)
  );

  const currentSignIndex = Math.floor(
    startLongitude / 30
  );

  const boundaryLongitude =
    (currentSignIndex + 1) * 30;

  // 現在位置から次の境界までの角距離
  const targetDelta = normalizeAngle(
    boundaryLongitude - startLongitude
  );

  let low = startDate.getTime();
  let high = null;

  // 1時間刻みで境界を通過する時刻を探す
  for (let i = 1; i <= 72; i++) {

    const testTime = new Date(
      startDate.getTime() + i * 3600000
    );

    const longitude = normalizeAngle(
      getMoonLongitude(testTime)
    );

    const progress = normalizeAngle(
      longitude - startLongitude
    );

    if (progress >= targetDelta) {
      high = testTime.getTime();
      break;
    }
  }

  if (high === null) {
    throw new Error(
      "次の星座移動時刻を発見できませんでした"
    );
  }

  // 二分探索で境界通過時刻を特定
  for (let i = 0; i < 45; i++) {

    const mid = (low + high) / 2;

    const longitude = normalizeAngle(
      getMoonLongitude(new Date(mid))
    );

    const progress = normalizeAngle(
      longitude - startLongitude
    );

    if (progress < targetDelta) {
      low = mid;
    } else {
      high = mid;
    }
  }

  return {
    sign: SIGNS[(currentSignIndex + 1) % 12],
    boundaryLongitude: normalizeAngle(
      boundaryLongitude
    ),
    timestamp: (low + high) / 2
  };
}

// 現在の星座への移動時刻を検索
function findPreviousIngress(startDate) {

  const currentLongitude = normalizeAngle(
    getMoonLongitude(startDate)
  );

  const currentSignIndex = Math.floor(
    currentLongitude / 30
  );

  const boundaryLongitude = currentSignIndex * 30;

  let previousTime = startDate;
  let foundTime = null;

  for (let i = 1; i <= 72; i++) {

    const testTime = new Date(
      startDate.getTime() - i * 3600000
    );

    const longitude = normalizeAngle(
      getMoonLongitude(testTime)
    );

    const distance = normalizeAngle(
      longitude - boundaryLongitude
    );

    const currentDistance = normalizeAngle(
      getMoonLongitude(previousTime) - boundaryLongitude
    );

    if (distance > currentDistance) {
      foundTime = testTime;
      break;
    }

    previousTime = testTime;
  }

  if (!foundTime) {
    throw new Error("前回の星座移動時刻を発見できませんでした");
  }

  let low = foundTime.getTime();
  let high = previousTime.getTime();

  for (let i = 0; i < 40; i++) {

    const mid = (low + high) / 2;
    const longitude = normalizeAngle(
      getMoonLongitude(new Date(mid))
    );

    const distance = normalizeAngle(
      longitude - boundaryLongitude
    );

    if (distance < 180) {
      high = mid;
    } else {
      low = mid;
    }
  }

  return {
    sign: SIGNS[currentSignIndex],
    boundaryLongitude,
    timestamp: (low + high) / 2
  };
}

// ========================================
// 相対黄経の連続値計算
// ========================================

function getRelativeLongitude(bodyName, date) {

  const moon = getMoonLongitude(date);
  const planet = getLongitude(bodyName, date);

  return normalizeAngle(moon - planet);
}

// 角度の変化を -180〜180° に変換
function signedAngleDifference(a, b) {
  return ((a - b + 540) % 360) - 180;
}

// ========================================
// アスペクトイベント検索
// ========================================

function findAspectEvents(
  bodyName,
  startDate,
  endDate,
  stepMinutes
) {

  const events = [];

  const step = stepMinutes * 60000;

  let t0 = startDate.getTime();
  let u0 = getRelativeLongitude(
    bodyName,
    new Date(t0)
  );

  while (t0 < endDate.getTime()) {

    const t1 = Math.min(
      t0 + step,
      endDate.getTime()
    );

    const u1 = getRelativeLongitude(
      bodyName,
      new Date(t1)
    );

    const delta = signedAngleDifference(u1, u0);

    const continuousU1 = u0 + delta;

    for (const aspect of ASPECTS) {

      const targets = [...new Set([
        aspect,
        normalizeAngle(360 - aspect)
      ])];

      for (const target of targets) {

        const first = Math.ceil(
          (Math.min(u0, continuousU1) - target) / 360
        );

        const last = Math.floor(
          (Math.max(u0, continuousU1) - target) / 360
        );

        for (let k = first; k <= last; k++) {

          const targetContinuous = target + 360 * k;

          if (
            targetContinuous < Math.min(u0, continuousU1) ||
            targetContinuous > Math.max(u0, continuousU1)
          ) {
            continue;
          }

          // 二分探索
          let low = t0;
          let high = t1;

          const increasing = continuousU1 >= u0;

          for (let j = 0; j < 40; j++) {

            const mid = (low + high) / 2;

            const raw = getRelativeLongitude(
              bodyName,
              new Date(mid)
            );

            const expected = u0 +
              delta * ((mid - t0) / (t1 - t0));

            const unwrapped = expected +
              signedAngleDifference(raw, normalizeAngle(expected));

            if (
              (increasing && unwrapped < targetContinuous) ||
              (!increasing && unwrapped > targetContinuous)
            ) {
              low = mid;
            } else {
              high = mid;
            }
          }

          const timestamp = (low + high) / 2;

          const duplicate = events.some(event =>
            event.angle === aspect &&
            Math.abs(event.timestamp - timestamp) < 1000
          );

          if (!duplicate) {
            events.push({
              body: bodyName,
              angle: aspect,
              timestamp
            });
          }
        }
      }
    }

    t0 = t1;
    u0 = continuousU1;
  }

  return events.sort(
    (a, b) => a.timestamp - b.timestamp
  );
}

// ========================================
// 全天体のアスペクトを計算
// ========================================

function calculateAllEvents(
  startDate,
  endDate,
  stepMinutes
) {

  let events = [];

  for (const body of BODIES) {

    const bodyEvents = findAspectEvents(
      body,
      startDate,
      endDate,
      stepMinutes
    );

    events = events.concat(bodyEvents);
  }

  return events.sort(
    (a, b) => a.timestamp - b.timestamp
  );
}

// ========================================
// 15分刻み・1分刻みの比較
// ========================================

function compareEvents(events15, events1) {

  const keys = [...new Set(
    [...events15, ...events1].map(event =>
      `${event.body}|${event.angle}`
    )
  )];

  const details = [];

  for (const key of keys) {

    const list15 = events15.filter(event =>
      `${event.body}|${event.angle}` === key
    );

    const list1 = events1.filter(event =>
      `${event.body}|${event.angle}` === key
    );

    const count = Math.min(
      list15.length,
      list1.length
    );

    for (let i = 0; i < count; i++) {

      const difference = Math.abs(
        list15[i].timestamp - list1[i].timestamp
      ) / 1000;

      details.push({
        event: key,
        status: difference < 1 ? "一致" : "差異あり",
        time15min: formatJST(
          new Date(list15[i].timestamp)
        ),
        time1min: formatJST(
          new Date(list1[i].timestamp)
        ),
        differenceSeconds: Number(
          difference.toFixed(3)
        )
      });
    }

    if (list15.length !== list1.length) {
      details.push({
        event: key,
        status: "イベント数不一致",
        count15min: list15.length,
        count1min: list1.length
      });
    }
  }

  const matched = details.filter(
    item => item.differenceSeconds !== undefined
  );

  return {
    eventCount15min: events15.length,
    eventCount1min: events1.length,
    matchedEvents: matched.length,
    missingFrom15min: Math.max(
      0,
      events1.length - events15.length
    ),
    missingFrom1min: Math.max(
      0,
      events15.length - events1.length
    ),
    maxDifferenceSeconds: matched.length
      ? Math.max(
          ...matched.map(item => item.differenceSeconds)
        )
      : null,
    details
  };
}

// ========================================
// アスペクト角度の実測検証エンジン
// ========================================

// 2天体の最小角距離を実測
function getMeasuredAngularSeparation(bodyName, date) {

  const moonLongitude = getLongitude("Moon", date);
  const bodyLongitude = getLongitude(bodyName, date);

  const relative = normalizeAngle(
    moonLongitude - bodyLongitude
  );

  return Math.min(relative, 360 - relative);
}

// 各アスペクト時刻を実測検証
function validateAspectEvents(events) {

  const results = events.map(event => {

    const eventTime = new Date(event.timestamp);

    const beforeTime = new Date(
      event.timestamp - 60000
    );

    const afterTime = new Date(
      event.timestamp + 60000
    );

    const beforeAngle = getMeasuredAngularSeparation(
      event.body,
      beforeTime
    );

    const actualAngle = getMeasuredAngularSeparation(
      event.body,
      eventTime
    );

    const afterAngle = getMeasuredAngularSeparation(
      event.body,
      afterTime
    );

    const beforeError = Math.abs(
      beforeAngle - event.angle
    );

    const actualError = Math.abs(
      actualAngle - event.angle
    );

    const afterError = Math.abs(
      afterAngle - event.angle
    );

    return {
      body: event.body,
      aspectAngle: event.angle,
      datetimeUTC: eventTime.toISOString(),
      datetimeJST: formatJST(eventTime),

      measuredAngleBefore: Number(
        beforeAngle.toFixed(9)
      ),

      measuredAngleAtEvent: Number(
        actualAngle.toFixed(9)
      ),

      measuredAngleAfter: Number(
        afterAngle.toFixed(9)
      ),

      errorBeforeDegrees: Number(
        beforeError.toFixed(9)
      ),

      errorAtEventDegrees: Number(
        actualError.toFixed(9)
      ),

      errorAtEventArcSeconds: Number(
        (actualError * 3600).toFixed(6)
      ),

      errorAfterDegrees: Number(
        afterError.toFixed(9)
      ),

      passed: actualError <= 0.001
    };
  });

  const passedCount = results.filter(
    result => result.passed
  ).length;

  return {
    totalEvents: results.length,
    passedCount,
    failedCount: results.length - passedCount,
    toleranceDegrees: 0.001,
    toleranceArcSeconds: 3.6,

    status:
      passedCount === results.length
        ? "ALL_PASSED"
        : "CHECK_REQUIRED",

    details: results
  };
}

// ========================================
// ボイドタイム計算
// ========================================

function calculateVoC(events, ingress, currentTime) {

  const ingressTime = ingress.timestamp;

  // 星座移動前に発生した最後のアスペクト
  const previousEvents = events.filter(event =>
    event.timestamp < ingressTime
  );

  const lastAspect = previousEvents.length
    ? previousEvents[previousEvents.length - 1]
    : null;

  const voidStart = lastAspect
    ? lastAspect.timestamp
    : null;

  const voidEnd = ingressTime;

  const isActive =
    voidStart !== null &&
    currentTime >= voidStart &&
    currentTime < voidEnd;

  const durationHours = voidStart !== null
    ? (voidEnd - voidStart) / 3600000
    : null;

  return {
    status: isActive
      ? "VOID_NOW"
      : "VOID_INACTIVE",

    isActiveNow: isActive,

    lastAspect: lastAspect
      ? {
          body: lastAspect.body,
          angle: lastAspect.angle,
          datetimeJST: formatJST(
            new Date(lastAspect.timestamp)
          )
        }
      : null,

    voidStartJST: voidStart !== null
      ? formatJST(new Date(voidStart))
      : null,

    voidEndJST: formatJST(
      new Date(voidEnd)
    ),

    durationHours: durationHours !== null
      ? Number(durationHours.toFixed(2))
      : null
  };
}

// ========================================
// メイン実行
// ========================================

function runTest() {

  const outputElement =
    document.getElementById("output");

  try {

    const currentLongitude =
      getMoonLongitude(now);

    const currentZodiac =
      getZodiac(currentLongitude);

    // 現在の月の星座移動区間
    const previousIngress =
      findPreviousIngress(now);

    const nextIngress =
      findNextIngress(now);

    const start = new Date(
      previousIngress.timestamp
    );

    const end = new Date(
      nextIngress.timestamp
    );

    // 15分刻み・1分刻み
    const events15 = calculateAllEvents(
      start,
      end,
      15
    );

    const events1 = calculateAllEvents(
      start,
      end,
      1
    );

    // 計算結果比較
    const comparison = compareEvents(
      events15,
      events1
    );

    // 角度の実測検証
    const angleValidation =
      validateAspectEvents(events1);

    // ボイドタイム
    const voidCalculation = calculateVoC(
      events1,
      nextIngress,
      now.getTime()
    );

    // 出力
    const output = {

      status: "SUCCESS",

      calculation: {
        zodiacSystem: "Tropical Zodiac",
        coordinateSystem: "Geocentric Ecliptic",
        timezone: "Asia/Tokyo",
        testTimeUTC: now.toISOString(),
        aspectAngles: ASPECTS,
        calculationBodies: BODIES,
        searchMethod:
          "Angular scan + bisection"
      },

      current: {
        datetimeUTC: now.toISOString(),
        longitude: currentLongitude,
        sign: currentZodiac.sign,
        degree: currentZodiac.degree,
        minute: currentZodiac.minute
      },

      currentSignPeriod: {
        previousIngress: {
          sign: previousIngress.sign,
          datetimeJST: formatJST(
            new Date(previousIngress.timestamp)
          )
        },

        nextIngress: {
          sign: nextIngress.sign,
          boundaryLongitude:
            nextIngress.boundaryLongitude,
          datetimeUTC: new Date(
            nextIngress.timestamp
          ).toISOString(),
          datetimeJST: formatJST(
            new Date(nextIngress.timestamp)
          )
        }
      },

      aspectEvents: events1.map(event => ({
        body: event.body,
        angle: event.angle,
        datetimeUTC: new Date(
          event.timestamp
        ).toISOString(),
        datetimeJST: formatJST(
          new Date(event.timestamp)
        )
      })),

      comparison,

      angleValidation,

      voidCalculation

    };

    outputElement.textContent =
      JSON.stringify(output, null, 2);

  } catch (error) {

    outputElement.textContent =
      JSON.stringify({
        status: "ERROR",
        message: error.message,
        stack: error.stack
      }, null, 2);

  }
}

// ページ読み込み時に実行
runTest();

</script>

</body>
</html>
