
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>10天体・12星座判定テスト</title>
</head>
<body>
  <h1>10天体・12星座判定テスト</h1>
  <pre id="result">計算中...</pre>

  <script src="../astronomy/astronomy.browser.min.js"></script>

  <script>
    const output = document.getElementById("result");

    const signs = [
      "牡羊座", "牡牛座", "双子座", "蟹座",
      "獅子座", "乙女座", "天秤座", "蠍座",
      "射手座", "山羊座", "水瓶座", "魚座"
    ];

    function getZodiac(longitude) {
      const normalized =
        ((longitude % 360) + 360) % 360;

      const signIndex =
        Math.floor(normalized / 30);

      const degreeInSign =
        normalized % 30;

      const degree =
        Math.floor(degreeInSign);

      const minute =
        Math.floor((degreeInSign - degree) * 60);

      return {
        sign: signs[signIndex],
        degree: degree,
        minute: minute
      };
    }

    try {
      const now = new Date();

      const planets = [
        ["Sun", "太陽"],
        ["Moon", "月"],
        ["Mercury", "水星"],
        ["Venus", "金星"],
        ["Mars", "火星"],
        ["Jupiter", "木星"],
        ["Saturn", "土星"],
        ["Uranus", "天王星"],
        ["Neptune", "海王星"],
        ["Pluto", "冥王星"]
      ];

      const positions = {};

      planets.forEach(([name, japanese]) => {
        let longitude;

        if (name === "Sun") {
          longitude = Astronomy.SunPosition(now).elon;
        } else if (name === "Moon") {
          longitude = Astronomy.EclipticGeoMoon(now).lon;
        } else {
          const vector = Astronomy.GeoVector(
            Astronomy.Body[name], now, true
          );
          longitude = Astronomy.Ecliptic(vector).elon;
        }

        positions[name] = {
          name: japanese,
          longitude: Number(longitude.toFixed(6)),
          zodiac: getZodiac(longitude)
        };
      });

      output.textContent = JSON.stringify({
        datetime: now.toISOString(),
        zodiacSystem: "Tropical Zodiac",
        coordinateSystem: "Geocentric Ecliptic",
        positions: positions,
        status: "SUCCESS"
      }, null, 2);

    } catch (error) {
      output.textContent = JSON.stringify({
        status: "ERROR",
        error: String(error),
        stack: error.stack || ""
      }, null, 2);
    }
  </script>
</body>
</html>
