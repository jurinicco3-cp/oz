
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astronomy Engine Test</title>
</head>
<body>
  <h1>Astronomy Engine 動作テスト</h1>
  <pre id="result">計算中...</pre>

  <script src="../astronomy/astronomy.browser.min.js"></script>


<script>
  const output = document.getElementById("result");

  try {
    const now = new Date();

    // 太陽の地心黄経
    const sun = Astronomy.SunPosition(now);

    // 月の地心黄経
    const moon = Astronomy.EclipticGeoMoon(now);

    // 月相
    const phase = Astronomy.MoonPhase(now);

    const result = {
      datetime: now.toISOString(),
      sunLongitude: sun.elon,
      moonLongitude: moon.lon,
      moonPhase: phase,
      status: "SUCCESS"
    };

    output.textContent = JSON.stringify(result, null, 2);

  } catch (error) {
    output.textContent =
      "ERROR: " + error.message + "\n" + error.stack;
  }
</script>

</body>
</html>
