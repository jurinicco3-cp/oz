
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astronomy Engine Test</title>
</head>
<body>
  <h1>Astronomy Engine 動作テスト</h1>
  <pre id="result">計算中...</pre>

  <script src="../astronomy/astronomy.browser.min.js"></script>

  <script>
    const output = document.getElementById("result");

    try {
      output.textContent =
        "Astronomyの存在: " + typeof Astronomy + "\n";

      const now = new Date();

      const moonLongitude =
        Astronomy.EclipticLongitude("Moon", now);

      const sunLongitude =
        Astronomy.EclipticLongitude("Sun", now);

      const moonPhase =
        Astronomy.MoonPhase(now);

      output.textContent += JSON.stringify({
        datetime: now.toISOString(),
        moonLongitude: moonLongitude,
        sunLongitude: sunLongitude,
        moonPhase: moonPhase,
        status: "SUCCESS"
      }, null, 2);

    } catch (error) {
      output.textContent +=
        "\nERROR: " + String(error) +
        "\n" + (error.stack || "");
    }
  </script>
</body>
</html>
