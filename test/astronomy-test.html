
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アスペクト検出漏れ検証</title>
<style>
  body {
    font-family: sans-serif;
    margin: 24px;
    background: #101827;
    color: #edf2f7;
    line-height: 1.6;
  }
  h1 { color: #e9c77b; font-size: 24px; }
  h2 { color: #e9c77b; font-size: 18px; margin-top: 28px; }
  button {
    padding: 12px 22px;
    border: 0;
    border-radius: 8px;
    background: #d6ae5c;
    color: #172033;
    font-weight: bold;
    cursor: pointer;
    font-size: 16px;
  }
  pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    background: #1d293b;
    padding: 16px;
    border-radius: 8px;
    font-size: 13px;
  }
  .note { color: #b8c5d6; font-size: 13px; }
  .ok { color: #8de0ae; }
  .warn { color: #f4c66d; }
  .bad { color: #ff8585; }
</style>
</head>
<body>

<h1>アスペクト検出漏れ検証エンジン</h1>

<p class="note">
15分・5分・1分間隔の検出結果を比較し、
検出漏れ・時刻差・角度誤差・重複を検証します。
</p>

<p>
  検証期間：
  <strong>2026年11月1日〜12月1日（UTC）</strong>
</p>

<button id="runButton" onclick="runTest()">検証スタート</button>

<h2>検証結果</h2>
<pre id="output">検証開始ボタンを押してください。</pre>

<script src="../astronomy/astronomy.browser.min.js"></script>

<script>
"use strict";

// ======================================
// 設定
// ======================================

const START = new Date("2026-11-01T00:00:00Z");
const END   = new Date("2026-12-01T00:00:00Z");

const BODIES = [
  "Sun",
  "Mercury",
  "Venus",
  "Mars",
  "Jupiter",
  "Saturn",
  "Uranus",
  "Neptune",
  "Pluto"
];

const ASPECTS = [0, 60, 90, 120, 180];

const STEPS = [
  { label: "15分間隔", minutes: 15 },
  { label: "5分間隔", minutes: 5 },
  { label: "1分間隔", minutes: 1 }
];

const output = document.getElementById("output");

// ======================================
// 基本角度関数
// ======================================

function normalize(angle) {
  return ((angle % 360) + 360) % 360;
}

function signedDiff(a, b) {
  return ((a - b + 540) % 360) - 180;
}

function getLongitude(body, date) {
  if (body === "Sun") {
    return Astronomy.SunPosition(date).elon;
  }

  if (body === "Moon") {
    return Astronomy.EclipticGeoMoon(date).lon;
  }

  const vector = Astronomy.GeoVector(
    Astronomy.Body[body],
    date,
    true
  );

  return Astronomy.Ecliptic(vector).elon;
}

// 月と対象天体の相対黄経
function getRelativeLongitude(body, date) {
  const moon = getLongitude("Moon", date);
  const planet = getLongitude(body, date);
  return normalize(moon - planet);
}

// ======================================
// アスペクト判定用ターゲット
// ======================================

// 例：60度の場合は60度方向と300度方向の両方を検出
function getTargets() {
  const targets = [];

  for (const aspect of ASPECTS) {
    targets.push(aspect);

    if (aspect !== 0 && aspect !== 180) {
      targets.push(360 - aspect);
    }
  }

  return [...new Set(targets)].sort((a, b) => a - b);
}

const TARGETS = getTargets();

// ======================================
// 1つの区間内でアスペクトを検出
// ======================================

function scanAspectEvents(stepMinutes) {
  const stepMs = stepMinutes * 60 * 1000;
  const events = [];

  for (const body of BODIES) {
    let t0 = START.getTime();
    const endMs = END.getTime();

    let date0 = new Date(t0);
    let r0 = getRelativeLongitude(body, date0);
    let unwrapped0 = r0;

    while (t0 < endMs) {
      const t1 = Math.min(t0 + stepMs, endMs);
      const date1 = new Date(t1);
      const r1 = getRelativeLongitude(body, date1);

      // 相対角度を連続した値に展開する
      const delta = signedDiff(r1, r0);
      const unwrapped1 = unwrapped0 + delta;

      const low = Math.min(unwrapped0, unwrapped1);
      const high = Math.max(unwrapped0, unwrapped1);

      // この区間を通過するアスペクト角を調べる
      for (let k = Math.floor((low - 360) / 360);
           k <= Math.ceil((high + 360) / 360);
           k++) {

        for (const targetBase of TARGETS) {
          const target = targetBase + 360 * k;

          // 区間内にターゲットが存在するか
          const crosses =
            (unwrapped0 < target && unwrapped1 >= target) ||
            (unwrapped0 > target && unwrapped1 <= target);

          if (!crosses) continue;

          // 二分探索で正確な時刻を求める
          const rootTime = findRoot(
            body,
            t0,
            t1,
            r0,
            unwrapped0,
            target
          );

          const aspect = Math.min(
            targetBase,
            360 - targetBase
          );

          events.push({
            body,
            aspect,
            timestamp: rootTime
          });
        }
      }

      t0 = t1;
      r0 = r1;
      unwrapped0 = unwrapped1;
    }
  }

  return removeDuplicates(events);
}

// ======================================
// 二分探索
// ======================================

function findRoot(
  body,
  leftTime,
  rightTime,
  leftRelative,
  leftUnwrapped,
  target
) {
  let lo = leftTime;
  let hi = rightTime;

  function valueAt(time) {
    const relative = getRelativeLongitude(
      body,
      new Date(time)
    );

    return leftUnwrapped +
      signedDiff(relative, leftRelative) -
      target;
  }

  let flo = valueAt(lo);

  for (let i = 0; i < 45; i++) {
    const mid = (lo + hi) / 2;
    const fm = valueAt(mid);

    if ((flo <= 0 && fm >= 0) ||
        (flo >= 0 && fm <= 0)) {
      hi = mid;
    } else {
      lo = mid;
      flo = fm;
    }

    if (hi - lo < 100) break;
  }

  return (lo + hi) / 2;
}

// ======================================
// 重複イベントの除去
// ======================================

function removeDuplicates(events) {
  events.sort((a, b) =>
    a.timestamp - b.timestamp
  );

  const result = [];

  for (const event of events) {
    const duplicate = result.some(existing =>
      existing.body === event.body &&
      existing.aspect === event.aspect &&
      Math.abs(
        existing.timestamp - event.timestamp
      ) < 2000
    );

    if (!duplicate) result.push(event);
  }

  return result;
}

// ======================================
// 検出結果の照合
// ======================================

function compareEvents(reference, candidate) {
  const used = new Set();
  const missing = [];
  const extra = [];

  for (const ref of reference) {
    let bestIndex = -1;
    let bestDiff = Infinity;

    candidate.forEach((item, index) => {
      if (used.has(index)) return;

      if (
        item.body !== ref.body ||
        item.aspect !== ref.aspect
      ) return;

      const diff = Math.abs(
        item.timestamp - ref.timestamp
      );

      if (diff < bestDiff) {
        bestDiff = diff;
        bestIndex = index;
      }
    });

    if (bestIndex >= 0 && bestDiff <= 120000) {
      used.add(bestIndex);
    } else {
      missing.push(ref);
    }
  }

  candidate.forEach((item, index) => {
    if (!used.has(index)) extra.push(item);
  });

  return { missing, extra };
}

// ======================================
// 角度誤差検証
// ======================================

function validateAngles(events) {
  let passed = 0;
  let failed = 0;
  let maxError = 0;
  const failures = [];

  for (const event of events) {
    const date = new Date(event.timestamp);

    const relative = getRelativeLongitude(
      event.body,
      date
    );

    const separation = Math.abs(
      signedDiff(relative, 0)
    );

    let error = Infinity;

    for (const aspect of ASPECTS) {
      error = Math.min(
        error,
        Math.abs(separation - aspect)
      );
    }

    maxError = Math.max(maxError, error);

    if (error <= 0.001) {
      passed++;
    } else {
      failed++;
      failures.push({
        ...event,
        error
      });
    }
  }

  return {
    passed,
    failed,
    maxError,
    failures
  };
}

// ======================================
// 逆行・順行の切り替わり確認
// ======================================

function checkDirectionChanges() {
  const changes = [];

  const intervalMs = 6 * 60 * 60 * 1000;

  for (const body of BODIES) {
    let previousTime = START.getTime();
    let previousLongitude = getLongitude(
      body,
      new Date(previousTime)
    );

    let previousDirection = 0;

    for (
      let time = previousTime + intervalMs;
      time <= END.getTime();
      time += intervalMs
    ) {
      const longitude = getLongitude(
        body,
        new Date(time)
      );

      const delta = signedDiff(
        longitude,
        previousLongitude
      );

      const direction =
        delta > 0.000001 ? 1 :
        delta < -0.000001 ? -1 : 0;

      if (
        direction !== 0 &&
        previousDirection !== 0 &&
        direction !== previousDirection
      ) {
        changes.push({
          body,
          timestamp: time,
          from: previousDirection > 0 ? "順行" : "逆行",
          to: direction > 0 ? "順行" : "逆行"
        });
      }

      if (direction !== 0) {
        previousDirection = direction;
      }

      previousLongitude = longitude;
    }
  }

  return changes;
}

// ======================================
// 表示用
// ======================================

function formatDate(timestamp) {
  return new Date(timestamp).toISOString();
}

function describeEvents(events, limit = 15) {
  if (events.length === 0) return "なし";

  return events.slice(0, limit).map(event =>
    `${event.body} ${event.aspect}° : ${
      formatDate(event.timestamp)
    }`
  ).join("\n");
}

// ======================================
// メイン検証
// ======================================

async function runTest() {
  const button = document.getElementById("runButton");
  button.disabled = true;
  button.textContent = "検証中...";

  output.textContent = "計算を開始しています...\n";

  try {
    const results = {};

    for (const config of STEPS) {
      output.textContent +=
        `\n${config.label}で検出中...\n`;

      await new Promise(resolve =>
        setTimeout(resolve, 30)
      );

      const events = scanAspectEvents(
        config.minutes
      );

      results[config.minutes] = events;

      output.textContent +=
        `${config.label}: ${events.length}件\n`;
    }

    // 1分間隔を比較基準とする
    const reference = results[1];

    const comparison15 = compareEvents(
      reference,
      results[15]
    );

    const comparison5 = compareEvents(
      reference,
      results[5]
    );

    const angleCheck = validateAngles(reference);

    const directionChanges =
      checkDirectionChanges();

    // 重複確認
    const duplicateCount =
      reference.length -
      removeDuplicates([...reference]).length;

    let report = "";

    report += "================================\n";
    report += "アスペクト検出漏れ検証結果\n";
    report += "================================\n\n";

    report += `検証期間: ${START.toISOString()} ～ ${END.toISOString()}\n\n`;

    report += "【検出件数】\n";
    report += `15分間隔: ${results[15].length}件\n`;
    report += `5分間隔 : ${results[5].length}件\n`;
    report += `1分間隔 : ${results[1].length}件\n\n`;

    report += "【15分間隔 vs 1分間隔】\n";
    report += `1分側で見つかった未検出: ${comparison15.missing.length}件\n`;
    report += `15分側だけの追加検出: ${comparison15.extra.length}件\n\n`;

    report += "【5分間隔 vs 1分間隔】\n";
    report += `1分側で見つかった未検出: ${comparison5.missing.length}件\n`;
    report += `5分側だけの追加検出: ${comparison5.extra.length}件\n\n`;

    report += "【角度精度】\n";
    report += `合格: ${angleCheck.passed}件\n`;
    report += `不合格: ${angleCheck.failed}件\n`;
    report += `最大角度誤差: ${angleCheck.maxError.toFixed(9)}°\n`;
    report += `許容誤差: 0.001°\n\n`;

    report += "【重複検出】\n";
    report += `重複件数: ${duplicateCount}件\n\n`;

    report += "【順行・逆行の方向変化】\n";
    report += `検出件数: ${directionChanges.length}件\n`;

    for (const change of directionChanges) {
      report +=
        `${change.body}: ${change.from} → ${change.to} / ${formatDate(change.timestamp)}\n`;
    }

    report += "\n【15分間隔で見落としたイベント】\n";
    report += describeEvents(comparison15.missing);
    report += "\n\n【5分間隔で見落としたイベント】\n";
    report += describeEvents(comparison5.missing);

    report += "\n\n【角度検証の不合格イベント】\n";
    report += angleCheck.failures.length
      ? angleCheck.failures.slice(0, 15).map(event =>
          `${event.body} ${event.aspect}° / 誤差 ${event.error}°`
        ).join("\n")
      : "なし";

    report += "\n\n================================\n";
    report += "判定の目安\n";
    report += "================================\n";

    if (
      comparison15.missing.length === 0 &&
      comparison5.missing.length === 0 &&
      angleCheck.failed === 0 &&
      duplicateCount === 0
    ) {
      report += "基本検証: PASS\n";
    } else {
      report += "基本検証: 要確認\n";
    }

    report += "\n※ 1分間隔の結果を比較基準としています。\n";
    report += "※ 同じ計算ロジック同士の比較であり、絶対的な検出漏れゼロの証明ではありません。\n";
    report += "※ 接触して反転するだけの接線的なアスペクトは、通常の符号反転検出では見落とす可能性があります。\n";
    report += "※ 方向変化は6時間ごとのサンプリングによる参考値です。\n";

    output.textContent = report;

  } catch (error) {
    output.textContent =
      "ERROR:\n" +
      error.stack;
  } finally {
    button.disabled = false;
    button.textContent = "もう一度検証する";
  }
}

</script>
</body>
</html>
