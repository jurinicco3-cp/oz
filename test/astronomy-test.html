
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アスペクト特殊ケース検証</title>
<style>
  body {
    font-family: sans-serif;
    margin: 22px;
    background: #101827;
    color: #edf2f7;
    line-height: 1.6;
  }
  h1 { color: #e9c77b; font-size: 23px; }
  h2 { color: #e9c77b; font-size: 17px; margin-top: 28px; }
  button {
    padding: 12px 22px;
    border: 0;
    border-radius: 8px;
    background: #d6ae5c;
    color: #172033;
    font-size: 16px;
    font-weight: bold;
  }
  button:disabled { opacity: .5; }
  pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    background: #1d293b;
    padding: 15px;
    border-radius: 8px;
    font-size: 12px;
  }
  .note { color: #b8c5d6; font-size: 13px; }
</style>
</head>
<body>

<h1>アスペクト特殊ケース検証エンジン</h1>

<p class="note">
接線・ニアミス、複数回通過、期間境界、留の時刻、
アスペクト成立前後の角度変化を検証します。
</p>

<p>
検証期間：2026年11月1日〜12月1日（UTC）<br>
基本走査間隔：1分
</p>

<button id="runButton" onclick="runTest()">特殊ケース検証スタート</button>

<h2>検証結果</h2>
<pre id="output">ボタンを押すと検証を開始します。</pre>

<script src="../astronomy/astronomy.browser.min.js"></script>

<script>
"use strict";

// ======================================
// 設定
// ======================================

const START = new Date("2026-11-01T00:00:00Z");
const END = new Date("2026-12-01T00:00:00Z");

const BODIES = [
  "Sun", "Mercury", "Venus", "Mars",
  "Jupiter", "Saturn", "Uranus",
  "Neptune", "Pluto"
];

const ASPECTS = [0, 60, 90, 120, 180];

const STEP_MS = 60 * 1000;

// 接線・ニアミスとして報告する角度誤差
const NEAR_MISS_LIMIT = 0.05;

// 成立判定の角度許容誤差
const ANGLE_TOLERANCE = 0.001;

const output = document.getElementById("output");

// ======================================
// 基本関数
// ======================================

function normalize(angle) {
  return ((angle % 360) + 360) % 360;
}

function signedDiff(a, b) {
  return ((a - b + 540) % 360) - 180;
}

function getLongitude(body, date) {
  if (body === "Sun") {
    return Astronomy.SunPosition(date).elon;
  }

  if (body === "Moon") {
    return Astronomy.EclipticGeoMoon(date).lon;
  }

  const vector = Astronomy.GeoVector(
    Astronomy.Body[body],
    date,
    false
  );

  return Astronomy.Ecliptic(vector).elon;
}

function getRelative(body, date) {
  return normalize(
    getLongitude("Moon", date) -
    getLongitude(body, date)
  );
}

function angularDistanceToAspect(relative) {
  const separation = Math.abs(signedDiff(relative, 0));

  return Math.min(
    ...ASPECTS.map(a => Math.abs(separation - a))
  );
}

function nearestAspect(relative) {
  const separation = Math.abs(signedDiff(relative, 0));

  return ASPECTS.reduce((best, current) =>
    Math.abs(separation - current) <
    Math.abs(separation - best)
      ? current
      : best
  , ASPECTS[0]);
}

function formatDate(time) {
  return new Date(time).toISOString();
}

// ======================================
// アスペクトターゲット生成
// ======================================

function getTargetBases() {
  const targets = [];

  for (const aspect of ASPECTS) {
    targets.push(aspect);

    if (aspect !== 0 && aspect !== 180) {
      targets.push(360 - aspect);
    }
  }

  return [...new Set(targets)];
}

const TARGETS = getTargetBases();

// ======================================
// 二分探索：アスペクト成立時刻
// ======================================

function findAspectRoot(
  body,
  t0,
  t1,
  raw0,
  unwrapped0,
  target
) {
  let lo = t0;
  let hi = t1;

  let flo = unwrapped0 - target;

  for (let i = 0; i < 45; i++) {
    const mid = (lo + hi) / 2;

    const rawMid = getRelative(
      body,
      new Date(mid)
    );

    const unwrappedMid =
      unwrapped0 + signedDiff(rawMid, raw0);

    const fm = unwrappedMid - target;

    if (
      (flo <= 0 && fm >= 0) ||
      (flo >= 0 && fm <= 0)
    ) {
      hi = mid;
    } else {
      lo = mid;
      flo = fm;
    }

    if (hi - lo < 100) break;
  }

  return (lo + hi) / 2;
}

// ======================================
// 黄金分割探索：極値の時刻
// ======================================

function goldenExtremum(
  body,
  left,
  right,
  anchorTime,
  anchorRaw,
  anchorUnwrapped,
  mode
) {
  const ratio = (Math.sqrt(5) - 1) / 2;

  function valueAt(time) {
    const raw = getRelative(body, new Date(time));

    return anchorUnwrapped +
      signedDiff(raw, anchorRaw);
  }

  function score(time) {
    const value = valueAt(time);
    return mode === "min" ? value : -value;
  }

  let a = left;
  let b = right;

  let c = b - ratio * (b - a);
  let d = a + ratio * (b - a);

  let fc = score(c);
  let fd = score(d);

  for (let i = 0; i < 45; i++) {
    if (fc < fd) {
      b = d;
      d = c;
      fd = fc;
      c = b - ratio * (b - a);
      fc = score(c);
    } else {
      a = c;
      c = d;
      fc = fd;
      d = a + ratio * (b - a);
      fd = score(d);
    }

    if (b - a < 100) break;
  }

  const time = (a + b) / 2;

  return {
    timestamp: time,
    value: valueAt(time)
  };
}

// ======================================
// イベント重複除去
// ======================================

function deduplicate(events, toleranceMs = 2000) {
  events.sort((a, b) => a.timestamp - b.timestamp);

  const result = [];

  for (const event of events) {
    const duplicate = result.some(existing =>
      existing.body === event.body &&
      existing.aspect === event.aspect &&
      Math.abs(existing.timestamp - event.timestamp) <
        toleranceMs
    );

    if (!duplicate) result.push(event);
  }

  return result;
}

// ======================================
// 本体：1分間隔のデータを作成
// ======================================

function buildSamples(body) {
  const samples = [];

  let previousRaw = null;
  let unwrapped = null;

  for (
    let time = START.getTime();
    time <= END.getTime();
    time += STEP_MS
  ) {
    const date = new Date(time);
    const raw = getRelative(body, date);

    if (previousRaw === null) {
      unwrapped = raw;
    } else {
      unwrapped += signedDiff(raw, previousRaw);
    }

    samples.push({
      time,
      raw,
      unwrapped
    });

    previousRaw = raw;
  }

  if (samples[samples.length - 1].time < END.getTime()) {
    const time = END.getTime();
    const raw = getRelative(body, new Date(time));

    unwrapped += signedDiff(raw, previousRaw);

    samples.push({ time, raw, unwrapped });
  }

  return samples;
}

// ======================================
// 通常のアスペクト通過検出
// ======================================

function detectCrossings(body, samples) {
  const events = [];

  for (let i = 1; i < samples.length; i++) {
    const a = samples[i - 1];
    const b = samples[i];

    const low = Math.min(a.unwrapped, b.unwrapped);
    const high = Math.max(a.unwrapped, b.unwrapped);

    for (
      let k = Math.floor((low - 360) / 360) - 1;
      k <= Math.ceil((high + 360) / 360) + 1;
      k++
    ) {
      for (const base of TARGETS) {
        const target = base + 360 * k;

        const crosses =
          (a.unwrapped < target && b.unwrapped >= target) ||
          (a.unwrapped > target && b.unwrapped <= target);

        if (!crosses) continue;

        const timestamp = findAspectRoot(
          body,
          a.time,
          b.time,
          a.raw,
          a.unwrapped,
          target
        );

        events.push({
          body,
          aspect: Math.min(base, 360 - base),
          timestamp,
          method: "crossing"
        });
      }
    }
  }

  return deduplicate(events);
}

// ======================================
// 接線・ニアミス検出
// ======================================

function detectTangencies(body, samples) {
  const results = [];

  for (let i = 1; i < samples.length - 1; i++) {
    const a = samples[i - 1];
    const b = samples[i];
    const c = samples[i + 1];

    const slope1 = b.unwrapped - a.unwrapped;
    const slope2 = c.unwrapped - b.unwrapped;

    const isMinimum = slope1 < 0 && slope2 >= 0;
    const isMaximum = slope1 > 0 && slope2 <= 0;

    if (!isMinimum && !isMaximum) continue;

    const extremum = goldenExtremum(
      body,
      a.time,
      c.time,
      b.time,
      b.raw,
      b.unwrapped,
      isMinimum ? "min" : "max"
    );

    const relative = getRelative(
      body,
      new Date(extremum.timestamp)
    );

    const error = angularDistanceToAspect(relative);

    if (error > NEAR_MISS_LIMIT) continue;

    const aspect = nearestAspect(relative);

    // 通常の通過イベントとほぼ同時刻なら接線候補から除外
    results.push({
      body,
      aspect,
      timestamp: extremum.timestamp,
      error,
      exactTouch: error <= ANGLE_TOLERANCE,
      type: error <= ANGLE_TOLERANCE
        ? "接線成立候補"
        : "ニアミス候補"
    });
  }

  return deduplicate(results, 5000);
}

// ======================================
// 逆行などによる複数回通過の確認
// ======================================

function findRepeatedPassages(events) {
  const grouped = {};

  for (const event of events) {
    const key = `${event.body}|${event.aspect}`;

    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(event);
  }

  const repeated = [];

  for (const [key, items] of Object.entries(grouped)) {
    if (items.length >= 2) {
      repeated.push({
        key,
        count: items.length,
        events: items
      });
    }
  }

  return repeated;
}

// ======================================
// 開始・終了境界の確認
// ======================================

function checkBoundaries() {
  const results = [];

  for (const body of BODIES) {
    for (const time of [
      START.getTime(),
      END.getTime()
    ]) {
      const relative = getRelative(
        body,
        new Date(time)
      );

      const error = angularDistanceToAspect(relative);

      if (error <= NEAR_MISS_LIMIT) {
        results.push({
          body,
          timestamp: time,
          aspect: nearestAspect(relative),
          error
        });
      }
    }
  }

  return results;
}

// ======================================
// 天体の留の時刻を検出
// ======================================

// 中央差分による黄経速度の近似値（度/日）
function getLongitudeSpeed(body, time) {
  const half = 5 * 60 * 1000;

  const before = getLongitude(
    body,
    new Date(time - half)
  );

  const after = getLongitude(
    body,
    new Date(time + half)
  );

  return signedDiff(after, before) /
    (2 * half / 86400000);
}

function refineStation(body, left, right) {
  let lo = left;
  let hi = right;
  let flo = getLongitudeSpeed(body, lo);

  for (let i = 0; i < 45; i++) {
    const mid = (lo + hi) / 2;
    const fm = getLongitudeSpeed(body, mid);

    if (
      (flo <= 0 && fm >= 0) ||
      (flo >= 0 && fm <= 0)
    ) {
      hi = mid;
    } else {
      lo = mid;
      flo = fm;
    }

    if (hi - lo < 1000) break;
  }

  return (lo + hi) / 2;
}

function detectStations() {
  const results = [];
  const scanStep = 60 * 60 * 1000;

  for (const body of BODIES) {
    let previousTime = START.getTime();
    let previousSpeed = getLongitudeSpeed(
      body,
      previousTime
    );

    for (
      let time = previousTime + scanStep;
      time <= END.getTime();
      time += scanStep
    ) {
      const speed = getLongitudeSpeed(body, time);

      const changed =
        (previousSpeed < 0 && speed >= 0) ||
        (previousSpeed > 0 && speed <= 0);

      if (changed) {
        const stationTime = refineStation(
          body,
          previousTime,
          time
        );

        const beforeSpeed = getLongitudeSpeed(
          body,
          stationTime - 60 * 60 * 1000
        );

        const afterSpeed = getLongitudeSpeed(
          body,
          stationTime + 60 * 60 * 1000
        );

        results.push({
          body,
          timestamp: stationTime,
          from: beforeSpeed < 0 ? "逆行" : "順行",
          to: afterSpeed < 0 ? "逆行" : "順行",
          speedAtStation: getLongitudeSpeed(
            body,
            stationTime
          )
        });
      }

      previousTime = time;
      previousSpeed = speed;
    }
  }

  return results;
}

// ======================================
// 成立時刻の前後確認
// ======================================

function validateEventSides(events) {
  const results = [];

  for (const event of events) {
    const beforeTime = event.timestamp - 60000;
    const afterTime = event.timestamp + 60000;

    const exactRelative = getRelative(
      event.body,
      new Date(event.timestamp)
    );

    const beforeRelative = getRelative(
      event.body,
      new Date(beforeTime)
    );

    const afterRelative = getRelative(
      event.body,
      new Date(afterTime)
    );

    const exactError = angularDistanceToAspect(
      exactRelative
    );

    const beforeError = angularDistanceToAspect(
      beforeRelative
    );

    const afterError = angularDistanceToAspect(
      afterRelative
    );

    const beforeDelta = signedDiff(
      beforeRelative,
      exactRelative
    );

    const afterDelta = signedDiff(
      afterRelative,
      exactRelative
    );

    results.push({
      ...event,
      exactError,
      beforeError,
      afterError,
      beforeDelta,
      afterDelta,
      pass: exactError <= ANGLE_TOLERANCE
    });
  }

  return results;
}

// ======================================
// 表示用
// ======================================

function formatEvents(events, limit = 20) {
  if (!events.length) return "なし";

  return events.slice(0, limit).map(event =>
    `${event.body} ${event.aspect}° / ${
      formatDate(event.timestamp)
    }`
  ).join("\n");
}

function formatTangencies(events) {
  if (!events.length) return "なし";

  return events.slice(0, 30).map(event =>
    `${event.body} ${event.aspect}° / ${
      formatDate(event.timestamp)
    } / 誤差 ${event.error.toFixed(7)}° / ${event.type}`
  ).join("\n");
}

// ======================================
// メイン処理
// ======================================

async function runTest() {
  const button = document.getElementById("runButton");

  button.disabled = true;
  button.textContent = "検証中...";

  output.textContent = "初期化中...\n";

  try {
    const allEvents = [];
    const allTangencies = [];
    const sampleStats = [];

    for (const body of BODIES) {
      output.textContent += `${body} を計算中...\n`;

      // ブラウザに描画機会を渡す
      await new Promise(resolve => setTimeout(resolve, 20));

      const samples = buildSamples(body);

      const crossings = detectCrossings(
        body,
        samples
      );

      const tangencies = detectTangencies(
        body,
        samples
      );

      allEvents.push(...crossings);
      allTangencies.push(...tangencies);

      sampleStats.push({
        body,
        samples: samples.length,
        events: crossings.length,
        tangencies: tangencies.length
      });
    }

    const repeated = findRepeatedPassages(allEvents);
    const boundaries = checkBoundaries();
    const stations = detectStations();
    const sideChecks = validateEventSides(allEvents);

    const failedSides = sideChecks.filter(
      item => !item.pass
    );

    const duplicateEvents =
      allEvents.length -
      deduplicate([...allEvents]).length;

    let report = "";

    report += "====================================\n";
    report += "特殊ケース検証結果\n";
    report += "====================================\n\n";

    report += `期間: ${START.toISOString()} ～ ${END.toISOString()}\n`;
    report += `走査間隔: 1分\n`;
    report += `対象天体: ${BODIES.join(", ")}\n`;
    report += `対象アスペクト: ${ASPECTS.join(", ")}度\n\n`;

    report += "【1. 通常アスペクト通過】\n";
    report += `検出イベント数: ${allEvents.length}件\n`;
    report += `重複数: ${duplicateEvents}件\n\n`;

    report += "【2. 接線・ニアミス】\n";
    report += `候補数: ${allTangencies.length}件\n`;
    report += `成立候補: ${allTangencies.filter(x => x.exactTouch).length}件\n`;
    report += `ニアミス候補: ${allTangencies.filter(x => !x.exactTouch).length}件\n`;
    report += `検出しきい値: ${NEAR_MISS_LIMIT}°\n\n`;
    report += formatTangencies(allTangencies);
    report += "\n\n";

    report += "【3. 同じアスペクトの複数回通過】\n";
    report += `該当ペア数: ${repeated.length}組\n`;

    for (const group of repeated) {
      report += `${group.key}: ${group.count}回\n`;

      for (const event of group.events) {
        report += `  ${formatDate(event.timestamp)}\n`;
      }
    }

    if (!repeated.length) {
      report += "複数回通過は見つかりませんでした。\n";
    }

    report += "\n【4. 期間境界付近】\n";
    report += `候補数: ${boundaries.length}件\n`;

    for (const item of boundaries) {
      report += `${item.body} ${item.aspect}° / ${formatDate(item.timestamp)} / 誤差 ${item.error.toFixed(7)}°\n`;
    }

    if (!boundaries.length) report += "候補なし\n";

    report += "\n【5. 天体の留（順行・逆行切り替え）】\n";
    report += `検出数: ${stations.length}件\n`;

    for (const station of stations) {
      report += `${station.body}: ${station.from} → ${station.to}\n`;
      report += `  時刻: ${formatDate(station.timestamp)}\n`;
      report += `  近似速度: ${station.speedAtStation.toExponential(5)} 度/日\n`;
    }

    if (!stations.length) report += "該当なし\n";

    report += "\n【6. アスペクト成立時刻の角度精度】\n";
    report += `検査数: ${sideChecks.length}件\n`;
    report += `合格: ${sideChecks.length - failedSides.length}件\n`;
    report += `不合格: ${failedSides.length}件\n`;
    report += `許容誤差: ${ANGLE_TOLERANCE}°\n`;

    if (failedSides.length) {
      for (const item of failedSides.slice(0, 20)) {
        report += `${item.body} ${item.aspect}° / 誤差 ${item.exactError.toFixed(9)}°\n`;
      }
    }

    report += "\n【7. 成立前後の角度変化】\n";

    for (const item of sideChecks.slice(0, 20)) {
      report += `${item.body} ${item.aspect}°\n`;
      report += `  成立時誤差: ${item.exactError.toFixed(8)}°\n`;
      report += `  1分前の相対角変化: ${item.beforeDelta.toFixed(7)}°\n`;
      report += `  1分後の相対角変化: ${item.afterDelta.toFixed(7)}°\n`;
    }

    report += "\n【8. 天体別集計】\n";

    for (const stat of sampleStats) {
      report += `${stat.body}: サンプル ${stat.samples} / 通過 ${stat.events} / 接線候補 ${stat.tangencies}\n`;
    }

    report += "\n====================================\n";
    report += "総合判定\n";
    report += "====================================\n";

    if (
      duplicateEvents === 0 &&
      failedSides.length === 0
    ) {
      report += "基本精度チェック: PASS\n";
    } else {
      report += "基本精度チェック: 要確認\n";
    }

    report += "\n※ 接線候補は極値付近の近似検出です。";
    report += "\n※ ニアミスは実際にアスペクトが成立したことを意味しません。";
    report += "\n※ 複数回通過は同じ天体ペア・同じアスペクトの複数イベントを集計しています。";
    report += "\n※ 留の時刻は黄経速度の符号変化を二分探索で近似しています。";
    report += "\n※ 1分間隔の走査でも、1分未満の極端に短い挙動や接線を完全に保証するものではありません。";
    report += "\n※ これは同じ天文計算ライブラリを使った内部検証であり、外部天文暦との独立照合ではありません。";

    output.textContent = report;

  } catch (error) {
    output.textContent =
      "ERROR:\n" + error.stack;
  } finally {
    button.disabled = false;
    button.textContent = "もう一度検証する";
  }
}

</script>
</body>
</html>
