
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>月の星座移動時刻テスト</title>
</head>
<body>
  <h1>月の星座移動時刻テスト</h1>
  <pre id="result">計算中...</pre>

  <script src="../astronomy/astronomy.browser.min.js"></script>

  <script>
    const output = document.getElementById("result");

    const signs = [
      "牡羊座", "牡牛座", "双子座", "蟹座",
      "獅子座", "乙女座", "天秤座", "蠍座",
      "射手座", "山羊座", "水瓶座", "魚座"
    ];

    // 月の地心黄経を取得
    function getMoonLongitude(date) {
      return Astronomy.EclipticGeoMoon(date).lon;
    }

    // 黄経から星座番号を取得
    function getSignIndex(longitude) {
      const normalized =
        ((longitude % 360) + 360) % 360;

      return Math.floor(normalized / 30);
    }

    // 日本時間に変換
    function formatJST(date) {
      return new Intl.DateTimeFormat("ja-JP", {
        timeZone: "Asia/Tokyo",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        weekday: "short",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).format(date);
    }

    try {
      const now = new Date();

      const currentLongitude =
        getMoonLongitude(now);

      const currentSignIndex =
        getSignIndex(currentLongitude);

      const nextSignIndex =
        (currentSignIndex + 1) % 12;

      // 次の星座の境界（30度単位）
      const nextBoundary =
        ((currentSignIndex + 1) * 30) % 360;

      // 現在地から境界までの角度
      const targetDistance =
        (nextBoundary - currentLongitude + 360) % 360;

      // 境界ぴったりの場合は次の境界を探す
      const requiredDistance =
        targetDistance < 0.000001
          ? 30
          : targetDistance;

      // 1時間ずつ進めて境界を探す
      const oneHour = 60 * 60 * 1000;

      let lowTime = now.getTime();
      let highTime = null;

      for (let i = 1; i <= 96; i++) {
        const testTime =
          new Date(now.getTime() + oneHour * i);

        const testLongitude =
          getMoonLongitude(testTime);

        const distance =
          (testLongitude - currentLongitude + 360) % 360;

        if (distance >= requiredDistance) {
          highTime = testTime.getTime();
          break;
        }
      }

      if (highTime === null) {
        throw new Error("4日以内に移動時刻を発見できませんでした");
      }

      // 二分探索で時刻を絞り込む
      for (let i = 0; i < 45; i++) {
        const midTime =
          (lowTime + highTime) / 2;

        const midLongitude =
          getMoonLongitude(new Date(midTime));

        const distance =
          (midLongitude - currentLongitude + 360) % 360;

        if (distance >= requiredDistance) {
          highTime = midTime;
        } else {
          lowTime = midTime;
        }
      }

      const ingressTime =
        new Date(highTime);

      const result = {
        status: "SUCCESS",

        calculation: {
          zodiacSystem: "Tropical Zodiac",
          coordinateSystem: "Geocentric Ecliptic",
          searchMethod: "Hourly scan + bisection"
        },

        current: {
          datetimeUTC: now.toISOString(),
          sign: signs[currentSignIndex],
          longitude: currentLongitude
        },

        nextIngress: {
          sign: signs[nextSignIndex],
          boundaryLongitude: nextBoundary,
          datetimeUTC: ingressTime.toISOString(),
          datetimeJST: formatJST(ingressTime)
        }
      };

      output.textContent =
        JSON.stringify(result, null, 2);

    } catch (error) {
      output.textContent = JSON.stringify({
        status: "ERROR",
        error: String(error),
        stack: error.stack || ""
      }, null, 2);
    }
  </script>
</body>
</html>
