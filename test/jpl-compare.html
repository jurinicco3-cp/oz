
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JPL Horizons XYZ比較</title>
<style>
body {
  font-family: sans-serif;
  max-width: 760px;
  margin: 30px auto;
  padding: 20px;
  line-height: 1.7;
  background: #f5f5f5;
  color: #222;
}
h1 { font-size: 1.5rem; }
.panel {
  background: white;
  padding: 18px;
  margin: 14px 0;
  border-radius: 10px;
  overflow-wrap: anywhere;
}
.label { color: #666; font-size: .9rem; }
.value { font-size: 1.3rem; font-weight: bold; }
pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: .9rem;
}
</style>
</head>
<body>

<h1>JPL Horizons 水星 XYZ比較</h1>

<div class="panel">
  <div class="label">比較日時（UTC）</div>
  <div id="date"></div>
</div>

<div class="panel">
  <h3>JPL Horizons</h3>
  <div class="label">J2000黄道座標（AU）</div>
  <pre id="jpl"></pre>
</div>

<div class="panel">
  <h3>Astronomy Engine</h3>
  <div class="label">J2000黄道座標（AU）</div>
  <pre id="engine"></pre>
</div>

<div class="panel">
  <h3>各軸の差（Astronomy Engine − JPL）</h3>
  <pre id="delta"></pre>
</div>

<div class="panel">
  <div class="label">3次元位置の差</div>
  <div class="value" id="distance"></div>
  <div id="km"></div>
</div>

<div class="panel">
  <div class="label">JPLに対する相対誤差</div>
  <div class="value" id="relative"></div>
</div>

<div class="panel">
  <div class="label">黄経の比較</div>
  <pre id="longitude"></pre>
</div>

<div class="panel">
  <div class="label">計算状態</div>
  <div id="status">計算中...</div>
</div>

<script src="../astronomy/astronomy.browser.min.js"></script>

<script>
function normalizeAngle(angle) {
  return ((angle % 360) + 360) % 360;
}

function longitudeFromXY(x, y) {
  return normalizeAngle(
    Math.atan2(y, x) * 180 / Math.PI
  );
}

function angularDifference(a, b) {
  const d = Math.abs(normalizeAngle(a) - normalizeAngle(b));
  return Math.min(d, 360 - d);
}

function runComparison() {
  // 比較日時
  const date = new Date("2026-11-10T04:21:51.295Z");

  // JPL Horizonsの座標
  // Mercury relative to Earth
  // Geometric / Ecliptic of J2000.0 / AU
  const jpl = {
    x: -5.972120996742202E-01,
    y: -4.310085947330867E-01,
    z:  1.771503447614654E-02
  };

  // Astronomy Engineの太陽中心ベクトル
  const mercury = Astronomy.HelioVector(
    Astronomy.Body.Mercury,
    date
  );

  const earth = Astronomy.HelioVector(
    Astronomy.Body.Earth,
    date
  );

  // 地球中心から見た水星の幾何学ベクトル
  // J2000赤道座標
  const geo = {
    x: mercury.x - earth.x,
    y: mercury.y - earth.y,
    z: mercury.z - earth.z
  };

  // J2000平均黄道傾斜角
  const epsilon = 23.439291111 * Math.PI / 180;

  // J2000赤道座標 → J2000黄道座標
  const engine = {
    x: geo.x,
    y: geo.y * Math.cos(epsilon) +
       geo.z * Math.sin(epsilon),
    z: -geo.y * Math.sin(epsilon) +
       geo.z * Math.cos(epsilon)
  };

  // 各軸の差
  const dx = engine.x - jpl.x;
  const dy = engine.y - jpl.y;
  const dz = engine.z - jpl.z;

  // 3次元ベクトルの差の大きさ
  const distance = Math.sqrt(
    dx * dx + dy * dy + dz * dz
  );

  // JPLベクトルの大きさ
  const jplMagnitude = Math.sqrt(
    jpl.x * jpl.x +
    jpl.y * jpl.y +
    jpl.z * jpl.z
  );

  const relativeError = distance / jplMagnitude * 100;

  // 黄経
  const jplLongitude = longitudeFromXY(jpl.x, jpl.y);
  const engineLongitude = longitudeFromXY(engine.x, engine.y);
  const longitudeDiff = angularDifference(
    jplLongitude,
    engineLongitude
  );

  // AU → km
  const AU_KM = 149597870.7;

  document.getElementById("date").textContent =
    date.toISOString().replace("T", " ").replace("Z", " UTC");

  document.getElementById("jpl").textContent =
    "X = " + jpl.x.toFixed(12) + "\n" +
    "Y = " + jpl.y.toFixed(12) + "\n" +
    "Z = " + jpl.z.toFixed(12);

  document.getElementById("engine").textContent =
    "X = " + engine.x.toFixed(12) + "\n" +
    "Y = " + engine.y.toFixed(12) + "\n" +
    "Z = " + engine.z.toFixed(12);

  document.getElementById("delta").textContent =
    "ΔX = " + dx.toExponential(9) + " AU\n" +
    "ΔY = " + dy.toExponential(9) + " AU\n" +
    "ΔZ = " + dz.toExponential(9) + " AU";

  document.getElementById("distance").textContent =
    distance.toExponential(9) + " AU";

  document.getElementById("km").textContent =
    (distance * AU_KM).toFixed(3) + " km";

  document.getElementById("relative").textContent =
    relativeError.toExponential(6) + " %";

  document.getElementById("longitude").textContent =
    "JPL: " + jplLongitude.toFixed(9) + "°\n" +
    "Astronomy Engine: " + engineLongitude.toFixed(9) + "°\n" +
    "差: " + longitudeDiff.toFixed(9) + "°\n" +
    "差（秒角）: " + (longitudeDiff * 3600).toFixed(3) + "″";

  document.getElementById("status").textContent =
    "比較計算完了";

  console.log({
    date: date.toISOString(),
    jpl,
    engine,
    delta: { dx, dy, dz },
    distance,
    distanceKm: distance * AU_KM,
    relativeError,
    jplLongitude,
    engineLongitude,
    longitudeDiff
  });
}

try {
  if (typeof Astronomy === "undefined") {
    throw new Error("Astronomy Engineを読み込めませんでした");
  }
  runComparison();
} catch (error) {
  document.getElementById("status").textContent =
    "エラー: " + error.message;
  console.error(error);
}
</script>

</body>
</html>
