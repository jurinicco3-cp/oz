
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JPL Horizons 水星位置比較</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 760px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.7;
      background: #f7f7f7;
      color: #222;
    }
    h1 { font-size: 1.5rem; }
    .panel {
      background: white;
      padding: 20px;
      margin: 16px 0;
      border-radius: 10px;
    }
    .value {
      font-size: 1.5rem;
      font-weight: bold;
      overflow-wrap: anywhere;
    }
    .label { color: #666; }
    #status { font-weight: bold; }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<h1>JPL Horizons 水星位置比較</h1>

<div class="panel">
  <div class="label">比較日時（UTC）</div>
  <div>2026-11-10 04:20:51.295</div>
</div>

<div class="panel">
  <div class="label">JPL Horizons 黄経（J2000黄道）</div>
  <div class="value" id="jpl">計算中...</div>
</div>

<div class="panel">
  <div class="label">Astronomy Engine 黄経（J2000黄道）</div>
  <div class="value" id="engine">計算中...</div>
</div>

<div class="panel">
  <div class="label">黄経の差</div>
  <div class="value" id="difference">計算中...</div>
  <div id="arcsec"></div>
</div>

<div class="panel">
  <div class="label">計算状態</div>
  <div id="status">計算中...</div>
</div>

<div class="panel">
  <div class="label">Astronomy Engineの地球中心ベクトル（J2000赤道座標）</div>
  <pre id="vector">---</pre>
</div>

<script src="../astronomy/astronomy.browser.min.js"></script>

<script>
function normalizeAngle(angle) {
  return ((angle % 360) + 360) % 360;
}

function angularDifference(a, b) {
  const diff = Math.abs(normalizeAngle(a) - normalizeAngle(b));
  return Math.min(diff, 360 - diff);
}

function longitudeFromXY(x, y) {
  return normalizeAngle(
    Math.atan2(y, x) * 180 / Math.PI
  );
}

function runComparison() {
  const date = new Date("2026-11-10T04:21:51.295Z");

  // JPL Horizonsの地球中心・幾何学的位置
  // Reference frame: Ecliptic of J2000.0
  const jplVector = {
    x: -5.972120996742202E-01,
    y: -4.310085947330867E-01,
    z:  1.771503447614654E-02
  };

  // JPLのX・Y座標から黄経を計算
  const jplLongitude = longitudeFromXY(
    jplVector.x,
    jplVector.y
  );

  // 同じ時刻の太陽中心ベクトルを取得
  // HelioVectorは光行時間補正・光行差補正なし
  const mercury = Astronomy.HelioVector(
    Astronomy.Body.Mercury,
    date
  );

  const earth = Astronomy.HelioVector(
    Astronomy.Body.Earth,
    date
  );

  // 水星 - 地球 = 地球中心から見た水星
  // まだJ2000赤道座標
  const geo = {
    x: mercury.x - earth.x,
    y: mercury.y - earth.y,
    z: mercury.z - earth.z
  };

  // J2000平均黄道傾斜角
  const obliquity = 23.439291111 * Math.PI / 180;

  // J2000赤道座標からJ2000黄道座標へ回転
  const eclipticX = geo.x;
  const eclipticY =
    geo.y * Math.cos(obliquity) +
    geo.z * Math.sin(obliquity);

  const eclipticZ =
    -geo.y * Math.sin(obliquity) +
    geo.z * Math.cos(obliquity);

  // J2000黄道座標での黄経
  const engineLongitude = longitudeFromXY(
    eclipticX,
    eclipticY
  );

  // 最小角度差
  const difference = angularDifference(
    jplLongitude,
    engineLongitude
  );

  const arcsec = difference * 3600;

  document.getElementById("jpl").textContent =
    jplLongitude.toFixed(9) + "°";

  document.getElementById("engine").textContent =
    engineLongitude.toFixed(9) + "°";

  document.getElementById("difference").textContent =
    difference.toFixed(9) + "°";

  document.getElementById("arcsec").textContent =
    arcsec.toFixed(3) + " 秒角";

  document.getElementById("vector").textContent =
    "X = " + geo.x.toFixed(12) + "\n" +
    "Y = " + geo.y.toFixed(12) + "\n" +
    "Z = " + geo.z.toFixed(12) + "\n\n" +
    "J2000黄道座標:\n" +
    "X = " + eclipticX.toFixed(12) + "\n" +
    "Y = " + eclipticY.toFixed(12) + "\n" +
    "Z = " + eclipticZ.toFixed(12);

  document.getElementById("status").textContent =
    "比較計算完了";

  console.log({
    jplLongitude,
    engineLongitude,
    difference,
    arcsec,
    geo,
    ecliptic: {
      x: eclipticX,
      y: eclipticY,
      z: eclipticZ
    }
  });
}

try {
  if (typeof Astronomy === "undefined") {
    throw new Error("Astronomy Engineを読み込めませんでした。");
  }

  runComparison();
} catch (error) {
  document.getElementById("status").textContent =
    "エラー: " + error.message;
  console.error(error);
}
</script>

</body>
</html>
