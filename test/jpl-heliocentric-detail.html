
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JPL Heliocentric Check</title>
<script src="../astronomy/astronomy.browser.min.js"></script>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 900px;
    margin: 30px auto;
    padding: 0 16px;
    line-height: 1.6;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    margin: 4px 0 12px;
  }
  button {
    padding: 10px 18px;
    cursor: pointer;
  }
  pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    background: #f3f3f3;
    padding: 14px;
    border-radius: 8px;
  }
</style>
</head>
<body>
<h1>JPL Heliocentric Check</h1>
<p>
JPL Horizonsの水星・地球のヘリオセントリック座標と、
Astronomy Engineの計算結果を比較します。
</p>

<h2>JPL Horizons データ</h2>
<p>時刻はTDB。座標はEcliptic J2000.0、単位はAUです。</p>

<label>JPL 水星 X</label>
<input id="mx" value="0.07202231785201493">
<label>JPL 水星 Y</label>
<input id="my" value="0.3026953212408176">
<label>JPL 水星 Z</label>
<input id="mz" value="0.01793715221654842">

<label>JPL 地球 X</label>
<input id="ex" value="0.6692183912465384">
<label>JPL 地球 Y</label>
<input id="ey" value="0.7337008454409786">
<label>JPL 地球 Z</label>
<input id="ez" value="0.0002250462585961101">

<button onclick="compare()">比較する</button>

<h2>比較結果</h2>
<pre id="result">「比較する」を押してください。</pre>

<script>
const DEG = Math.PI / 180;
const OBLIQUITY = 23.439291111 * DEG;

// JPLのTDB時刻をUTCに変換する。
// 2026年11月時点の TDB - UTC は約69.184秒。
const jplTdb = new Date("2026-11-10T04:21:51.295Z");
const utcDate = new Date(jplTdb.getTime() - 69.184 * 1000);

function readVector(prefix) {
  return {
    x: Number(document.getElementById(prefix + "x").value),
    y: Number(document.getElementById(prefix + "y").value),
    z: Number(document.getElementById(prefix + "z").value)
  };
}

function equatorialToEcliptic(v) {
  return {
    x: v.x,
    y: v.y * Math.cos(OBLIQUITY) + v.z * Math.sin(OBLIQUITY),
    z: -v.y * Math.sin(OBLIQUITY) + v.z * Math.cos(OBLIQUITY)
  };
}

function subtract(a, b) {
  return {
    x: a.x - b.x,
    y: a.y - b.y,
    z: a.z - b.z
  };
}

function distance(v) {
  return Math.sqrt(v.x*v.x + v.y*v.y + v.z*v.z);
}

function format(v) {
  return `X = ${v.x.toFixed(12)}
Y = ${v.y.toFixed(12)}
Z = ${v.z.toFixed(12)}`;
}

function compare() {
  const result = document.getElementById("result");

  try {
    const jplMercury = readVector("m");
    const jplEarth = readVector("e");
    const jplGeo = subtract(jplMercury, jplEarth);

    const aeMercuryEq = Astronomy.HelioVector(
      Astronomy.Body.Mercury, utcDate
    );
    const aeEarthEq = Astronomy.HelioVector(
      Astronomy.Body.Earth, utcDate
    );

    const aeMercury = equatorialToEcliptic(aeMercuryEq);
    const aeEarth = equatorialToEcliptic(aeEarthEq);
    const aeGeo = subtract(aeMercury, aeEarth);

    const delta = subtract(aeGeo, jplGeo);
    const dist = distance(delta);

    const jplLon = Math.atan2(jplGeo.y, jplGeo.x) / DEG;
    const aeLon = Math.atan2(aeGeo.y, aeGeo.x) / DEG;
    const lonDiff = ((aeLon - jplLon + 540) % 360) - 180;
    const arcsec = lonDiff * 3600;

    result.textContent =
`JPLのTDB時刻: 2026-11-10 04:21:51.295
比較に使用するUTC: ${utcDate.toISOString()}

【JPL 水星 - 地球】
${format(jplGeo)}

【Astronomy Engine 水星 - 地球】
${format(aeGeo)}

【差（AE - JPL）】
${format(delta)}

3D距離: ${dist.toExponential(9)} AU
距離: ${(dist * 149597870.7).toFixed(3)} km

JPL黄経: ${jplLon.toFixed(9)}°
AE黄経: ${aeLon.toFixed(9)}°
黄経差: ${arcsec.toFixed(4)} 秒角

※時刻変換は約69.184秒の近似です。
※座標系・時刻系の差が残る可能性があります。`;
  } catch (error) {
    result.textContent = "エラー: " + error.message;
  }
}
</script>
</body>
</html>
