
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JPL ICRF Coordinate Diagnostic</title>
<script src="../astronomy/astronomy.browser.min.js"></script>
<style>
body {
  font-family: system-ui, sans-serif;
  max-width: 900px;
  margin: 30px auto;
  padding: 0 16px;
  line-height: 1.6;
}
button {
  padding: 10px 18px;
  cursor: pointer;
}
pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background: #f3f3f3;
  padding: 14px;
  border-radius: 8px;
}
</style>
</head>
<body>

<h1>JPL ICRF Coordinate Diagnostic</h1>
<p>JPL ICRF座標とAstronomy Engine EQJ座標を比較します。</p>

<button onclick="compare()">比較する</button>

<h2>比較結果</h2>
<pre id="result">比較ボタンを押してください。</pre>

<script>
const DEG = Math.PI / 180;
const AU_KM = 149597870.7;
const J2000_JD = 2451545.0;

// JPL TDB時刻
const JPL_TDB_JD = 2461354.681843692;

// TDB - TT の近似計算（秒）
function tdbMinusTtSeconds(jdTdb) {
  const T = (jdTdb - J2000_JD) / 36525;

  return (
    0.001657 * Math.sin(628.3076 * T + 6.2401) +
    0.000022 * Math.sin(575.3385 * T + 4.2970) +
    0.000014 * Math.sin(1256.6152 * T + 6.1969) +
    0.000005 * Math.sin(606.9777 * T + 4.0212) +
    0.000005 * Math.sin(52.9691 * T + 0.4444) +
    0.000002 * Math.sin(21.3299 * T + 5.5431) +
    0.000102 * T * Math.sin(628.3076 * T + 4.2490)
  );
}

const tdbMinusTt = tdbMinusTtSeconds(JPL_TDB_JD);

const JPL_TT_JD =
  JPL_TDB_JD - tdbMinusTt / 86400;

// Astronomy EngineにTTを直接渡す
const aeTime = Astronomy.AstroTime.FromTerrestrialTime(
  JPL_TT_JD - J2000_JD
);

// JPL 水星（太陽中心・ICRF）
const jplMercury = {
  x: 0.07307489017818641,
  y: 0.2665419200717218,
  z: 0.1348147782015284
};

// JPL 地球（太陽中心・ICRF）
const jplEarth = {
  x: 0.6702709635727099,
  y: 0.6690272283116131,
  z: 0.2900083903109221
};

// ベクトルの引き算
function subtract(a, b) {
  return {
    x: a.x - b.x,
    y: a.y - b.y,
    z: a.z - b.z
  };
}

// 3D距離
function distance(v) {
  return Math.hypot(v.x, v.y, v.z);
}

// ベクトルの角度差
function angleBetween(a, b) {
  const cx = a.y * b.z - a.z * b.y;
  const cy = a.z * b.x - a.x * b.z;
  const cz = a.x * b.y - a.y * b.x;

  const cross = Math.hypot(cx, cy, cz);

  const dot =
    a.x * b.x +
    a.y * b.y +
    a.z * b.z;

  return Math.atan2(cross, dot);
}

// 座標表示
function format(v) {
  return `X = ${v.x.toFixed(12)}
Y = ${v.y.toFixed(12)}
Z = ${v.z.toFixed(12)}`;
}

// 距離・方向の差を分析
function analyzePosition(name, jpl, ae) {
  const jplDistance = distance(jpl);
  const aeDistance = distance(ae);

  const delta = subtract(ae, jpl);
  const totalKm = distance(delta) * AU_KM;

  const ux = jpl.x / jplDistance;
  const uy = jpl.y / jplDistance;
  const uz = jpl.z / jplDistance;

  const radialAU =
    delta.x * ux +
    delta.y * uy +
    delta.z * uz;

  const transverseAU = Math.sqrt(
    Math.max(0, distance(delta) ** 2 - radialAU ** 2)
  );

  const angleRad = angleBetween(jpl, ae);
  const angleDeg = angleRad / DEG;
  const angleArcsec = angleDeg * 3600;

  return `【${name}：距離と方向の差】

JPL距離: ${(jplDistance * AU_KM).toFixed(3)} km
AE距離: ${(aeDistance * AU_KM).toFixed(3)} km

距離の差（AE - JPL）:
${((aeDistance - jplDistance) * AU_KM).toFixed(3)} km

距離方向のずれ:
${(radialAU * AU_KM).toFixed(3)} km

横方向のずれ:
${(transverseAU * AU_KM).toFixed(3)} km

方向の角度差:
${angleDeg.toFixed(10)} 度
${angleArcsec.toFixed(6)} 秒角

位置全体の差:
${totalKm.toFixed(3)} km

`;
}

// 個別天体の比較
function check(name, jpl, ae) {
  const delta = subtract(ae, jpl);

  return `【${name}】

JPL（ICRF）:
${format(jpl)}

Astronomy Engine（EQJ）:
${format(ae)}

差（AE - JPL）:
${format(delta)}

3D距離差: ${distance(delta).toExponential(9)} AU
距離: ${(distance(delta) * AU_KM).toFixed(3)} km

`;
}

// 水星と地球の相対位置比較
function compareRelative(jplMercury, jplEarth, aeMercury, aeEarth) {
  const jplRelative = subtract(jplMercury, jplEarth);
  const aeRelative = subtract(aeMercury, aeEarth);
  const delta = subtract(aeRelative, jplRelative);

  return `【水星 − 地球：相対位置比較】

JPL相対位置（ICRF）:
${format(jplRelative)}

AE相対位置（EQJ）:
${format(aeRelative)}

相対位置の差（AE - JPL）:
${format(delta)}

3D相対位置差:
${distance(delta).toExponential(9)} AU

距離:
${(distance(delta) * AU_KM).toFixed(3)} km

`;
}

// 地球から見た水星の比較
function analyzeGeocentricMercury(
  jplMercury,
  jplEarth,
  aeMercury,
  aeEarth
) {
  const jplRelative = subtract(jplMercury, jplEarth);
  const aeRelative = subtract(aeMercury, aeEarth);
  const delta = subtract(aeRelative, jplRelative);

  const jplDistance = distance(jplRelative);
  const aeDistance = distance(aeRelative);
  const difference = distance(delta);

  const ux = jplRelative.x / jplDistance;
  const uy = jplRelative.y / jplDistance;
  const uz = jplRelative.z / jplDistance;

  const radialAU =
    delta.x * ux +
    delta.y * uy +
    delta.z * uz;

  const transverseAU = Math.sqrt(
    Math.max(0, difference ** 2 - radialAU ** 2)
  );

  const angleRad = angleBetween(jplRelative, aeRelative);
  const angleDeg = angleRad / DEG;
  const angleArcsec = angleDeg * 3600;

  return `【地球から見た水星：相対位置の差】

JPL 地球・水星間距離:
${(jplDistance * AU_KM).toFixed(3)} km

AE 地球・水星間距離:
${(aeDistance * AU_KM).toFixed(3)} km

距離の差（AE - JPL）:
${((aeDistance - jplDistance) * AU_KM).toFixed(3)} km

距離方向のずれ:
${(radialAU * AU_KM).toFixed(3)} km

横方向のずれ:
${(transverseAU * AU_KM).toFixed(3)} km

方向の角度差:
${angleDeg.toFixed(10)} 度
${angleArcsec.toFixed(6)} 秒角

位置全体の差:
${(difference * AU_KM).toFixed(3)} km

`;
}

// メイン比較処理
function compare() {
  try {
    // Astronomy Engineの生データ（EQJ）
    const aeMercury = Astronomy.HelioVector(
      Astronomy.Body.Mercury,
      aeTime
    );

    const aeEarth = Astronomy.HelioVector(
      Astronomy.Body.Earth,
      aeTime
    );

    // 個別比較
    const mercuryResult = check(
      "Mercury",
      jplMercury,
      aeMercury
    );

    const earthResult = check(
      "Earth",
      jplEarth,
      aeEarth
    );

    // 相対位置比較
    const relativeResult = compareRelative(
      jplMercury,
      jplEarth,
      aeMercury,
      aeEarth
    );

    // 地球から見た水星の比較
    const geocentricResult = analyzeGeocentricMercury(
      jplMercury,
      jplEarth,
      aeMercury,
      aeEarth
    );

    // 距離と方向の分析
    const directionResult =
      analyzePosition("水星", jplMercury, aeMercury) +
      analyzePosition("地球", jplEarth, aeEarth);

    document.getElementById("result").textContent =
`JPL TDB: 2026-11-10 04:21:51.295
JPL TDB JD: ${JPL_TDB_JD}
TDB-TT補正: ${tdbMinusTt.toFixed(9)} 秒
AE入力TT JD: ${(J2000_JD + aeTime.tt).toFixed(12)}

【座標系】
JPL: ICRF
AE: J2000平均赤道座標 EQJ

${mercuryResult}
${earthResult}
${relativeResult}
${geocentricResult}
${directionResult}

※JPLはDE441の太陽中心ICRF座標です。
※AEはHelioVectorによるEQJ座標です。
※ICRFとEQJは厳密には同一ではありません。
※今回の直接比較には座標系の微小な違いも含まれます。
※TDB-TT変換には近似式を使用しています。`;

  } catch (e) {
    document.getElementById("result").textContent =
      "エラー: " + e.message;
  }
}
</script>

</body>
</html>
