
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JPL Coordinate Diagnostic</title>
<script src="../astronomy/astronomy.browser.min.js"></script>
<style>
body {
  font-family: system-ui, sans-serif;
  max-width: 900px;
  margin: 30px auto;
  padding: 0 16px;
  line-height: 1.6;
}
button { padding: 10px 18px; cursor: pointer; }
pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background: #f3f3f3;
  padding: 14px;
  border-radius: 8px;
}
</style>
</head>
<body>
<h1>JPL Coordinate Diagnostic</h1>
<p>EQJ座標とJPL黄道座標を比較します。</p>
<button onclick="compare()">比較する</button>
<h2>比較結果</h2>
<pre id="result">比較ボタンを押してください。</pre>

<script>
const DEG = Math.PI / 180;
const EPS = 23.439291111 * DEG;

// JPL TDB時刻からUTCへの近似変換
const utcDate = new Date("2026-11-10T04:21:51.295Z");
utcDate.setTime(utcDate.getTime() - 69.184 * 1000);

// JPL 水星（ヘリオセントリック、黄道J2000）
const jplMercury = {
  x: 0.07202231785201493,
  y: 0.3026953212408176,
  z: 0.01793715221654842
};

// JPL 地球（ヘリオセントリック、黄道J2000）
const jplEarth = {
  x: 0.6692183912465384,
  y: 0.7337008454409786,
  z: 0.0002250462585961101
};

// 黄道座標から赤道座標 EQJ に戻す
function eclipticToEquatorial(v) {
  return {
    x: v.x,
    y: v.y * Math.cos(EPS) - v.z * Math.sin(EPS),
    z: v.y * Math.sin(EPS) + v.z * Math.cos(EPS)
  };
}

function subtract(a, b) {
  return {
    x: a.x - b.x,
    y: a.y - b.y,
    z: a.z - b.z
  };
}

function distance(v) {
  return Math.hypot(v.x, v.y, v.z);
}

function format(v) {
  return `X = ${v.x.toFixed(12)}
Y = ${v.y.toFixed(12)}
Z = ${v.z.toFixed(12)}`;
}

function check(name, jpl) {
  const body = Astronomy.Body[name];
  const ae = Astronomy.HelioVector(body, utcDate);
  const jplEq = eclipticToEquatorial(jpl);
  const delta = subtract(ae, jplEq);

  return `【${name}】

JPLからEQJに変換:
${format(jplEq)}

Astronomy Engine 生データ（EQJ）:
${format(ae)}

差（AE - JPL）:
${format(delta)}

3D距離差: ${distance(delta).toExponential(9)} AU
距離: ${(distance(delta) * 149597870.7).toFixed(3)} km

`;
}

function compare() {
  try {
    document.getElementById("result").textContent =
`JPL TDB: 2026-11-10 04:21:51.295
AE使用UTC: ${utcDate.toISOString()}

【座標系】
JPL: ICRF基準の黄道座標
AE: J2000平均赤道座標 EQJ

${check("Mercury", jplMercury)}
${check("Earth", jplEarth)}

※時刻変換は約69.184秒の近似です。
※JPLの黄道座標を固定黄道傾斜角でEQJに戻しています。`;
  } catch (e) {
    document.getElementById("result").textContent =
      "エラー: " + e.message;
  }
}
</script>
</body>
</html>
