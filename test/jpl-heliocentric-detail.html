<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JPL Coordinate Diagnostic</title>
<script src="../astronomy/astronomy.browser.min.js"></script>
<style>
body {
  font-family: system-ui, sans-serif;
  max-width: 900px;
  margin: 30px auto;
  padding: 0 16px;
  line-height: 1.6;
}
button {
  padding: 10px 18px;
  cursor: pointer;
}
pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background: #f3f3f3;
  padding: 14px;
  border-radius: 8px;
}
</style>
</head>
<body>

<h1>JPL Coordinate Diagnostic</h1>
<p>EQJ座標とJPL黄道座標を比較します。</p>

<button onclick="compare()">比較する</button>

<h2>比較結果</h2>
<pre id="result">比較ボタンを押してください。</pre>

<script>
const DEG = Math.PI / 180;
const EPS = 23.439291111 * DEG;
const AU_KM = 149597870.7;

// JPL TDB時刻からUTCへの近似変換

// JPLのTDB時刻（2行目）
const JPL_TDB_JD = 2461354.681843692;
const J2000_JD = 2451545.0;

// TDB - TT の近似計算（秒）
function tdbMinusTtSeconds(jdTdb) {
  const T = (jdTdb - J2000_JD) / 36525;

  return (
    0.001657 * Math.sin(628.3076 * T + 6.2401) +
    0.000022 * Math.sin(575.3385 * T + 4.2970) +
    0.000014 * Math.sin(1256.6152 * T + 6.1969) +
    0.000005 * Math.sin(606.9777 * T + 4.0212) +
    0.000005 * Math.sin(52.9691 * T + 0.4444) +
    0.000002 * Math.sin(21.3299 * T + 5.5431) +
    0.000102 * T * Math.sin(628.3076 * T + 4.2490)
  );
}

const tdbMinusTt = tdbMinusTtSeconds(JPL_TDB_JD);

// TT = TDB - (TDB - TT)
const JPL_TT_JD =
  JPL_TDB_JD - tdbMinusTt / 86400;

// Astronomy EngineにTTを直接渡す
const aeTime = Astronomy.AstroTime.FromTerrestrialTime(
  JPL_TT_JD - J2000_JD
);

// JPL 水星（ヘリオセントリック、黄道J2000）
const jplMercury = {
  x: 0.07307489017818641,
  y: 0.2981736695058780,
  z: 0.01766585379897668
};

// JPL 地球（ヘリオセントリック、黄道J2000）
const jplEarth = {
  x: 0.6702709635727099,
  y: 0.7291791937060391,
  z: -0.00004625215897568905
};

// 黄道座標から赤道座標 EQJ に戻す
function eclipticToEquatorial(v) {
  return {
    x: v.x,
    y: v.y * Math.cos(EPS) - v.z * Math.sin(EPS),
    z: v.y * Math.sin(EPS) + v.z * Math.cos(EPS)
  };
}

// ベクトルの引き算
function subtract(a, b) {
  return {
    x: a.x - b.x,
    y: a.y - b.y,
    z: a.z - b.z
  };
}

// 3D距離
function distance(v) {
  return Math.hypot(v.x, v.y, v.z);
}

// 座標表示
function format(v) {
  return `X = ${v.x.toFixed(12)}
Y = ${v.y.toFixed(12)}
Z = ${v.z.toFixed(12)}`;
}

// 個別天体の比較
function check(name, jpl, ae) {
  const jplEq = eclipticToEquatorial(jpl);
  const delta = subtract(ae, jplEq);

  return `【${name}】

JPLからEQJに変換:
${format(jplEq)}

Astronomy Engine 生データ（EQJ）:
${format(ae)}

差（AE - JPL）:
${format(delta)}

3D距離差: ${distance(delta).toExponential(9)} AU
距離: ${(distance(delta) * AU_KM).toFixed(3)} km

`;
}

// 相対位置の比較
function compareRelative(jplMercuryEq, jplEarthEq, aeMercury, aeEarth) {

  // JPLの水星 - 地球
  const jplRelative = subtract(jplMercuryEq, jplEarthEq);

  // AEの水星 - 地球
  const aeRelative = subtract(aeMercury, aeEarth);

  // 相対位置の差
  const delta = subtract(aeRelative, jplRelative);

  return `【水星 − 地球：相対位置比較】

JPL 相対位置（EQJ）:
${format(jplRelative)}

Astronomy Engine 相対位置（EQJ）:
${format(aeRelative)}

相対位置の差（AE - JPL）:
${format(delta)}

3D相対位置差: ${distance(delta).toExponential(9)} AU
距離: ${(distance(delta) * AU_KM).toFixed(3)} km

`;
}

function compare() {
  try {
    // Astronomy Engineの生データ
    const aeMercury = Astronomy.HelioVector(
      Astronomy.Body.Mercury,
      aeTime
    );

    const aeEarth = Astronomy.HelioVector(
      Astronomy.Body.Earth,
      aeTime
    );

    // JPL座標をEQJに変換
    const jplMercuryEq = eclipticToEquatorial(jplMercury);
    const jplEarthEq = eclipticToEquatorial(jplEarth);

    // 個別比較
    const mercuryResult = check(
      "Mercury",
      jplMercury,
      aeMercury
    );

    const earthResult = check(
      "Earth",
      jplEarth,
      aeEarth
    );

    // 相対位置比較
    const relativeResult = compareRelative(
      jplMercuryEq,
      jplEarthEq,
      aeMercury,
      aeEarth
    );

    document.getElementById("result").textContent =
`JPL TDB: 2026-11-10 04:21:51.295
JPL TDB JD: ${JPL_TDB_JD}
TDB-TT補正: ${tdbMinusTt.toFixed(9)} 秒
AE入力TT JD: ${(J2000_JD + aeTime.tt).toFixed(12)}

【座標系】
JPL: ICRF基準の黄道座標
AE: J2000平均赤道座標 EQJ

${mercuryResult}
${earthResult}
${relativeResult}
※JPLのTDBからTDB-TTの周期項を用いてTTを計算し、
  Astronomy EngineのFromTerrestrialTimeに直接渡しています。
※TDB-TTの変換は近似式です。
※JPLの黄道座標を固定黄道傾斜角でEQJに変換しています。`;

  } catch (e) {
    document.getElementById("result").textContent =
      "エラー: " + e.message;
  }
}
</script>

</body>
</html>
