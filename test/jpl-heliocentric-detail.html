
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JPL Heliocentric Detail Check</title>
<script src="../astronomy/astronomy.browser.min.js"></script>
<style>
body {
  font-family: system-ui, sans-serif;
  max-width: 900px;
  margin: 30px auto;
  padding: 0 16px;
  line-height: 1.6;
}
pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background: #f3f3f3;
  padding: 14px;
  border-radius: 8px;
}
button {
  padding: 10px 18px;
  cursor: pointer;
}
</style>
</head>
<body>

<h1>JPL Heliocentric Detail Check</h1>
<p>JPL HorizonsとAstronomy Engineのヘリオセントリック座標を個別に比較します。</p>

<button onclick="compare()">比較する</button>

<h2>比較結果</h2>
<pre id="result">「比較する」を押してください。</pre>

<script>
const DEG = Math.PI / 180;
const OBLIQUITY = 23.439291111 * DEG;

// JPLのTDB時刻に対応するUTC時刻（約69.184秒差）
const utcDate = new Date("2026-11-10T04:21:51.295Z");
utcDate.setTime(utcDate.getTime() - 69.184 * 1000);

// JPL Horizonsの水星ヘリオセントリック座標（2行目）
const jplMercury = {
  x: 0.07202231785201493,
  y: 0.3026953212408176,
  z: 0.01793715221654842
};

// JPL Horizonsの地球ヘリオセントリック座標（2行目）
const jplEarth = {
  x: 0.6692183912465384,
  y: 0.7337008454409786,
  z: 0.0002250462585961101
};

function equatorialToEcliptic(v) {
  return {
    x: v.x,
    y: v.y * Math.cos(OBLIQUITY) + v.z * Math.sin(OBLIQUITY),
    z: -v.y * Math.sin(OBLIQUITY) + v.z * Math.cos(OBLIQUITY)
  };
}

function subtract(a, b) {
  return {
    x: a.x - b.x,
    y: a.y - b.y,
    z: a.z - b.z
  };
}

function distance(v) {
  return Math.sqrt(v.x*v.x + v.y*v.y + v.z*v.z);
}

function format(v) {
  return `X = ${v.x.toFixed(12)}
Y = ${v.y.toFixed(12)}
Z = ${v.z.toFixed(12)}`;
}

function compareBody(name, jpl, ae) {
  const delta = subtract(ae, jpl);
  const dist = distance(delta);

  return `【${name}】

JPL:
${format(jpl)}

Astronomy Engine:
${format(ae)}

差（AE - JPL）:
${format(delta)}

3D距離差: ${dist.toExponential(9)} AU
距離: ${(dist * 149597870.7).toFixed(3)} km

`;
}

function compare() {
  const result = document.getElementById("result");

  try {
    const aeMercury = equatorialToEcliptic(
      Astronomy.HelioVector(Astronomy.Body.Mercury, utcDate)
    );

    const aeEarth = equatorialToEcliptic(
      Astronomy.HelioVector(Astronomy.Body.Earth, utcDate)
    );

    result.textContent =
`JPL TDB: 2026-11-10 04:21:51.295
使用UTC: ${utcDate.toISOString()}

${compareBody("水星", jplMercury, aeMercury)}
${compareBody("地球", jplEarth, aeEarth)}

※JPLはGEOMETRIC、Ecliptic J2000.0、AU。
※UTC変換は約69.184秒の近似です。
※座標系・時刻系の差が残る可能性があります。`;

  } catch (error) {
    result.textContent = "エラー: " + error.message;
  }
}
</script>

</body>
</html>
