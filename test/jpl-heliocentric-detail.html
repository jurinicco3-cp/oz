
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOON & TIME - JPL 2時刻比較</title>

<script src="https://jurinicco3-cp.github.io/oz/astronomy/astronomy.browser.min.js"></script>

<style>
  body {
    margin: 0;
    padding: 24px;
    background: #101522;
    color: #edf1fa;
    font-family: system-ui, -apple-system, sans-serif;
    line-height: 1.6;
  }
  main {
    max-width: 1000px;
    margin: auto;
  }
  h1 { font-size: 25px; }
  h2 {
    margin-top: 32px;
    padding-bottom: 8px;
    border-bottom: 1px solid #39445b;
    font-size: 20px;
  }
  h3 { font-size: 17px; }
  .intro, .card {
    background: #1a2233;
    border: 1px solid #35415a;
    border-radius: 12px;
    padding: 16px;
    margin: 14px 0;
  }
  .muted { color: #aab5ca; font-size: 13px; }
  .epoch {
    color: #a9c9ff;
    font-weight: 700;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 10px;
  }
  th, td {
    text-align: right;
    padding: 8px 6px;
    border-bottom: 1px solid #35415a;
    white-space: nowrap;
  }
  th:first-child, td:first-child { text-align: left; }
  th { color: #aab5ca; font-weight: 600; }
  .value {
    font-size: 22px;
    font-weight: 700;
    color: #d6e5ff;
    overflow-wrap: anywhere;
  }
  .good { color: #9ee0b1; }
  .warning { color: #ffd18a; }
  .error { color: #ffaaaa; }
  .scroll { overflow-x: auto; }
  code {
    color: #c5d9ff;
    overflow-wrap: anywhere;
  }
  button {
    background: #729ce8;
    color: #101522;
    border: 0;
    border-radius: 8px;
    padding: 12px 20px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin: 12px 0;
  }
  #status { color: #ffd18a; }
</style>
</head>

<body>
<main>
  <h1>MOON & TIME</h1>
  <p class="muted">JPL Horizons DE441 と Astronomy Engine の2時刻比較</p>

  <div class="intro">
    <strong>今回の検証内容</strong>
    <p>
      JPL Horizonsの2つの時刻について、水星・地球の太陽中心位置を比較します。
      JPLのICRF座標にはフレームバイアス行列を適用し、
      Astronomy EngineのEQJ座標と比較します。
    </p>
    <p class="muted">
      フレーム変換はICRF/GCRSとJ2000平均赤道・平均春分点の近似的な整合です。
      ICRFの実現差などが残る可能性があります。
    </p>
  </div>

  <button id="runButton" onclick="runComparison()">比較を実行</button>
  <p id="status">計算待ち</p>
  <div id="results"></div>
</main>

<script>
"use strict";

// =====================================================
// 1. JPL Horizonsの時刻（TDB）
// =====================================================

const JPL_EPOCHS = [
  {
    label: "1つ目の時刻",
    tdbJD: 2461354.681149248,

    mercury: {
      x: 0.07309778298570406,
      y: 0.2665379926792839,
      z: 0.1348103076213735
    },

    earth: {
      x: 0.6702799575602734,
      y: 0.6690198487058370,
      z: 0.2900051913583030
    }
  },

  {
    label: "2つ目の時刻",
    tdbJD: 2461354.681843692,

    mercury: {
      x: 0.07307489017818641,
      y: 0.2665419200717218,
      z: 0.1348147782015284
    },

    earth: {
      x: 0.6702709635727099,
      y: 0.6690272283116131,
      z: 0.2900083903109221
    }
  }
];


// =====================================================
// 2. 定数
// =====================================================

const J2000_JD = 2451545.0;
const AU_KM = 149597870.7;
const RAD_TO_ARCSEC = 206264.80624709636;


// =====================================================
// 3. TDBからTTへの近似変換
// =====================================================

function tdbMinusTtSeconds(tdbJD) {
  const days = tdbJD - J2000_JD;
  const g = (357.53 + 0.9856003 * days) * Math.PI / 180;

  return (
    0.001657 * Math.sin(g) +
    0.000022 * Math.sin(2 * g)
  );
}

function tdbToTtJD(tdbJD) {
  const correction = tdbMinusTtSeconds(tdbJD);
  return tdbJD - correction / 86400;
}


// =====================================================
// 4. ICRFからJ2000平均赤道・平均春分点への
//    IAU 2000 frame-bias行列
// =====================================================

const FRAME_BIAS = [
  [
    0.9999999999999942,
   -0.0000000707827974,
    0.0000000805621715
  ],
  [
    0.0000000707827948,
    0.9999999999999969,
    0.0000000330604145
  ],
  [
   -0.0000000805621738,
   -0.0000000330604117,
    0.9999999999999966
  ]
];

function icrfToEqj(v) {
  return {
    x: FRAME_BIAS[0][0] * v.x +
       FRAME_BIAS[0][1] * v.y +
       FRAME_BIAS[0][2] * v.z,

    y: FRAME_BIAS[1][0] * v.x +
       FRAME_BIAS[1][1] * v.y +
       FRAME_BIAS[1][2] * v.z,

    z: FRAME_BIAS[2][0] * v.x +
       FRAME_BIAS[2][1] * v.y +
       FRAME_BIAS[2][2] * v.z
  };
}


// =====================================================
// 5. ベクトル計算
// =====================================================

function subtract(a, b) {
  return {
    x: a.x - b.x,
    y: a.y - b.y,
    z: a.z - b.z
  };
}

function add(a, b) {
  return {
    x: a.x + b.x,
    y: a.y + b.y,
    z: a.z + b.z
  };
}

function magnitude(v) {
  return Math.sqrt(v.x*v.x + v.y*v.y + v.z*v.z);
}

function dot(a, b) {
  return a.x*b.x + a.y*b.y + a.z*b.z;
}

function scale(v, k) {
  return { x: v.x*k, y: v.y*k, z: v.z*k };
}

function differenceMetrics(jpl, ae) {
  const residual = subtract(ae, jpl);

  const jplLength = magnitude(jpl);
  const aeLength = magnitude(ae);
  const residualLength = magnitude(residual);

  const cosine = dot(jpl, ae) / (jplLength * aeLength);
  const angle = Math.acos(Math.max(-1, Math.min(1, cosine)));

  const radial = dot(residual, scale(jpl, 1 / jplLength));
  const transverse = Math.sqrt(
    Math.max(0, residualLength*residualLength - radial*radial)
  );

  return {
    residual,
    distanceKm: residualLength * AU_KM,
    angleArcsec: angle * RAD_TO_ARCSEC,
    radialKm: radial * AU_KM,
    transverseKm: transverse * AU_KM,
    jplDistanceKm: jplLength * AU_KM,
    aeDistanceKm: aeLength * AU_KM
  };
}


// =====================================================
// 6. 表示用
// =====================================================

function fmt(value, digits = 3) {
  return Number(value).toLocaleString("en-US", {
    minimumFractionDigits: digits,
    maximumFractionDigits: digits
  });
}

function fmtAU(value) {
  return value.toFixed(12);
}

function vectorText(v) {
  return `
    <code>
      X: ${fmtAU(v.x)}<br>
      Y: ${fmtAU(v.y)}<br>
      Z: ${fmtAU(v.z)}
    </code>
  `;
}

function metricsTable(rows) {
  return `
    <div class="scroll">
    <table>
      <thead>
        <tr>
          <th>比較項目</th>
          <th>位置差 km</th>
          <th>角度差 arcsec</th>
          <th>動径差 km</th>
          <th>横方向差 km</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map(r => `
          <tr>
            <td>${r.name}</td>
            <td>${fmt(r.m.distanceKm)}</td>
            <td>${fmt(r.m.angleArcsec, 6)}</td>
            <td>${fmt(r.m.radialKm)}</td>
            <td>${fmt(r.m.transverseKm)}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
    </div>
  `;
}


// =====================================================
// 7. 1時刻分の計算
// =====================================================

function calculateEpoch(epoch) {
  const ttJD = tdbToTtJD(epoch.tdbJD);

  // Astronomy EngineにはTTを渡す
  const aeTime = Astronomy.AstroTime.FromTerrestrialTime(
    ttJD - J2000_JD
  );

  // Astronomy Engineの太陽中心ベクトル（EQJ）
  const aeMercury = Astronomy.HelioVector(
    Astronomy.Body.Mercury,
    aeTime
  );

  const aeEarth = Astronomy.HelioVector(
    Astronomy.Body.Earth,
    aeTime
  );

  // JPLのICRFベクトルをEQJ相当に変換
  const jplMercury = icrfToEqj(epoch.mercury);
  const jplEarth = icrfToEqj(epoch.earth);

  // 水星・地球の比較
  const mercuryMetrics = differenceMetrics(jplMercury, aeMercury);
  const earthMetrics = differenceMetrics(jplEarth, aeEarth);

  // 地球中心から見た水星のベクトル
  const jplGeo = subtract(jplMercury, jplEarth);
  const aeGeo = subtract(aeMercury, aeEarth);

  const geoMetrics = differenceMetrics(jplGeo, aeGeo);

  return {
    label: epoch.label,
    tdbJD: epoch.tdbJD,
    ttJD,
    correctionSeconds: tdbMinusTtSeconds(epoch.tdbJD),
    jplMercury,
    jplEarth,
    aeMercury,
    aeEarth,
    mercuryMetrics,
    earthMetrics,
    jplGeo,
    aeGeo,
    geoMetrics
  };
}


// =====================================================
// 8. 2時刻間の残差変化
// =====================================================

function residualChange(a, b) {
  // 各時刻の残差（AE - JPL）の変化
  const change = subtract(
    b.residual,
    a.residual
  );

  return {
    vector: change,
    distanceKm: magnitude(change) * AU_KM,
    xKm: change.x * AU_KM,
    yKm: change.y * AU_KM,
    zKm: change.z * AU_KM
  };
}


// =====================================================
// 9. 結果表示
// =====================================================

function renderEpoch(result) {
  const rows = [
    { name: "水星（太陽中心）", m: result.mercuryMetrics },
    { name: "地球（太陽中心）", m: result.earthMetrics },
    { name: "水星（地球中心）", m: result.geoMetrics }
  ];

  return `
    <section class="card">
      <h2>${result.label}</h2>

      <p class="epoch">JPL TDB JD: ${result.tdbJD}</p>
      <p class="muted">AEに渡したTT JD: ${result.ttJD.toFixed(12)}</p>
      <p class="muted">
        TDB − TT近似値: ${fmt(result.correctionSeconds, 9)} 秒
      </p>

      ${metricsTable(rows)}

      <h3>水星：JPL変換後 / Astronomy Engine</h3>
      <p class="muted">JPL（ICRF → EQJ相当）</p>
      ${vectorText(result.jplMercury)}
      <p class="muted">Astronomy Engine（EQJ）</p>
      ${vectorText(result.aeMercury)}

      <h3>地球：JPL変換後 / Astronomy Engine</h3>
      <p class="muted">JPL（ICRF → EQJ相当）</p>
      ${vectorText(result.jplEarth)}
      <p class="muted">Astronomy Engine（EQJ）</p>
      ${vectorText(result.aeEarth)}
    </section>
  `;
}


function renderChange(name, a, b) {
  const c = residualChange(a, b);

  return `
    <tr>
      <td>${name}</td>
      <td>${fmt(c.distanceKm)}</td>
      <td>${fmt(c.xKm)}</td>
      <td>${fmt(c.yKm)}</td>
      <td>${fmt(c.zKm)}</td>
    </tr>
  `;
}


function runComparison() {
  const status = document.getElementById("status");
  const output = document.getElementById("results");

  try {
    if (typeof Astronomy === "undefined") {
      throw new Error("Astronomy Engineが読み込まれていません。");
    }

    const results = JPL_EPOCHS.map(calculateEpoch);

    const first = results[0];
    const second = results[1];

    const changes = [
      {
        name: "水星（太陽中心）",
        a: first.mercuryMetrics,
        b: second.mercuryMetrics
      },
      {
        name: "地球（太陽中心）",
        a: first.earthMetrics,
        b: second.earthMetrics
      },
      {
        name: "水星（地球中心）",
        a: first.geoMetrics,
        b: second.geoMetrics
      }
    ];

    output.innerHTML =
      results.map(renderEpoch).join("") +
      `
      <section class="card">
        <h2>2時刻間の残差変化</h2>
        <p>
          それぞれの時刻での残差（AE − JPL）が、
          60秒間でどれだけ変化したかを表示します。
        </p>

        <div class="scroll">
        <table>
          <thead>
            <tr>
              <th>対象</th>
              <th>残差変化の大きさ km</th>
              <th>ΔX km</th>
              <th>ΔY km</th>
              <th>ΔZ km</th>
            </tr>
          </thead>
          <tbody>
            ${changes.map(c =>
              renderChange(c.name, c.a, c.b)
            ).join("")}
          </tbody>
        </table>
        </div>

        <h3>2時刻の誤差量の比較</h3>
        <div class="scroll">
        <table>
          <thead>
            <tr>
              <th>対象</th>
              <th>1つ目 km</th>
              <th>2つ目 km</th>
              <th>差 km</th>
            </tr>
          </thead>
          <tbody>
            ${changes.map(c => `
              <tr>
                <td>${c.name}</td>
                <td>${fmt(c.a.distanceKm)}</td>
                <td>${fmt(c.b.distanceKm)}</td>
                <td>${fmt(c.b.distanceKm - c.a.distanceKm)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
        </div>
      </section>

      <section class="card">
        <h2>今回の検証で見るポイント</h2>
        <ol>
          <li>水星の残差ベクトルが60秒間でどれだけ変化したか</li>
          <li>地球の残差ベクトルも同じ傾向を示すか</li>
          <li>地球中心の水星の残差がどう変化したか</li>
        </ol>
        <p class="muted">
          残差変化が小さくても、誤差の原因が特定できたことにはなりません。
          まずは時間に対する残差の変化を観察するための比較です。
        </p>
      </section>
      `;

    status.textContent = "計算完了";
    status.className = "good";

  } catch (error) {
    status.textContent = "エラー: " + error.message;
    status.className = "error";
    console.error(error);
  }
}
</script>
</body>
</html>
